<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#1C1C1E">
	<meta name="description" content="ATSHEL HSE Manager — Incidentes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>ATSHEL — Incidentes</title>
	<link rel="manifest" href="/manifest.json">
	<link rel="stylesheet" href="/css/atshel-theme.css">
	<style>
		body {
			display: flex;
			flex-direction: column;
			min-height: 100dvh;
			background: var(--color-bg);
		}

		/* ── Filtros ── */
		.filters {
			background: var(--color-surface);
			border-bottom: 1px solid var(--color-border);
			padding: var(--s3) var(--s4);
			display: flex;
			gap: var(--s2);
			overflow-x: auto;
			scrollbar-width: none;
			-webkit-overflow-scrolling: touch;
			flex-shrink: 0;
		}

		.filters::-webkit-scrollbar { display: none; }

		.filter-chip {
			display: flex;
			align-items: center;
			padding: var(--s2) var(--s3);
			border-radius: 20px;
			border: 1px solid var(--color-border);
			background: transparent;
			font-family: var(--font-display);
			font-size: var(--text-xs);
			font-weight: 600;
			letter-spacing: 0.04em;
			color: var(--color-text-muted);
			white-space: nowrap;
			cursor: pointer;
			min-height: 36px;
			transition: all var(--transition);
		}

		.filter-chip--active {
			background: var(--color-yellow-dim);
			border-color: var(--color-yellow);
			color: var(--color-yellow);
		}

		/* ── Lista ── */
		.list-main {
			flex: 1;
			padding: var(--s4);
			padding-bottom: calc(var(--bottom-nav-height) + var(--s4));
			display: flex;
			flex-direction: column;
			gap: var(--s3);
			max-width: 600px;
			width: 100%;
			margin: 0 auto;
		}

		/* ── Item de incidente ── */
		.incidente-card {
			background: var(--color-surface);
			border: 1px solid var(--color-border);
			border-radius: var(--radius);
			padding: var(--s4);
			display: flex;
			flex-direction: column;
			gap: var(--s2);
			transition: border-color var(--transition), background var(--transition);
			text-decoration: none;
			color: inherit;
			min-height: 80px;
		}

		.incidente-card:active {
			background: var(--color-surface-2);
			border-color: var(--color-yellow);
		}

		.incidente-card--leve        { border-left: 3px solid var(--color-blue); }
		.incidente-card--moderado    { border-left: 3px solid var(--color-orange); }
		.incidente-card--grave       { border-left: 3px solid var(--color-red); }
		.incidente-card--catastrofico { border-left: 3px solid #9C27B0; }

		.incidente-card__header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--s2);
		}

		.incidente-card__num {
			font-family: var(--font-display);
			font-size: var(--text-xs);
			font-weight: 700;
			letter-spacing: 0.06em;
			color: var(--color-text-muted);
		}

		.incidente-card__badges {
			display: flex;
			gap: var(--s1);
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.incidente-card__desc {
			font-size: var(--text-sm);
			font-weight: 500;
			color: var(--color-text);
			line-height: 1.4;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.incidente-card__meta {
			display: flex;
			align-items: center;
			gap: var(--s3);
			font-size: var(--text-xs);
			color: var(--color-text-muted);
		}

		.incidente-card__meta-item {
			display: flex;
			align-items: center;
			gap: 4px;
		}

		.incidente-card__meta-item svg {
			width: 12px;
			height: 12px;
			flex-shrink: 0;
		}

		/* ── FAB ── */
		.fab {
			position: fixed;
			bottom: calc(var(--bottom-nav-height) + var(--s4));
			right: var(--s4);
			width: 56px;
			height: 56px;
			background: var(--color-yellow);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: var(--shadow-lg);
			z-index: 50;
			transition: transform var(--transition);
		}

		.fab:active { transform: scale(0.94); }
		.fab svg { width: 26px; height: 26px; color: var(--color-bg); }

		/* ── Empty state ── */
		.empty-full {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: var(--s3);
			padding: var(--s12) var(--s4);
			text-align: center;
		}

		/* Chip severidad */
		.chip--leve        { background: var(--color-blue-dim);        color: var(--color-blue); }
		.chip--moderado    { background: var(--color-orange-dim);      color: var(--color-orange); }
		.chip--grave       { background: var(--color-red-dim);         color: var(--color-red); }
		.chip--catastrofico { background: rgba(156,39,176,0.15);        color: #CE93D8; }
		.chip--abierto     { background: var(--color-orange-dim);      color: var(--color-orange); }
		.chip--investigacion { background: var(--color-blue-dim);      color: var(--color-blue); }
		.chip--cerrado     { background: var(--color-green-dim);       color: var(--color-green); }
	</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.9/dist/purify.min.js"></script>
<script src="/js/atshel-supabase.js"></script>

<script>
/* ──────────────────────────────────────────────────────────
   incidentes.js — Lista de incidentes ATSHEL

   Campos reales: id, numero, tipo, severidad, descripcion,
   fecha_hora, ubicacion, estado, estado_aprobacion,
   created_by, deleted_at

   Estados válidos: 'Abierto' | 'En investigación' | 'Cerrado'
   Severidades: 'Leve' | 'Moderado' | 'Grave' | 'Catastrófico'

   Filtros: por estado o por severidad grave/catastrófico
   Paginación: keyset (cursor) — no offset
   ────────────────────────────────────────────────────────── */

(function IncidentesModule() {
	'use strict';

	/* ── Estado ─────────────────────────────────────────── */
	let _todos        = [];   /* todos los incidentes cargados */
	let _filtroActual = 'todos';
	let _cargando     = false;

	/* ── DOM ─────────────────────────────────────────────── */
	const $ = id => document.getElementById(id);

	/* ── Sync badge ──────────────────────────────────────── */
	function setSyncBadge(estado) {
		const badge = $('sync-badge');
		const label = $('sync-label');
		if (!badge || !label) return;
		const map = {
			ok:      { cls: 'sync-badge--ok',     txt: 'Sincronizado' },
			offline: { cls: 'sync-badge--offline', txt: 'Sin conexión' },
			loading: { cls: 'sync-badge--loading', txt: '...' }
		};
		const s = map[estado] || map.loading;
		badge.className = 'sync-badge ' + s.cls;
		label.textContent = s.txt;
	}

	/* ── Formatear fecha ─────────────────────────────────── */
	function fmtFecha(isoStr) {
		if (!isoStr) return '—';
		const d = new Date(isoStr);
		if (isNaN(d.getTime())) return '—';
		const p = n => String(n).padStart(2, '0');
		return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
	}

	/* ── Mapeos ──────────────────────────────────────────── */
	function sevClass(sev) {
		return { 'Leve':'leve','Moderado':'moderado','Grave':'grave','Catastrófico':'catastrofico' }[sev] || 'leve';
	}

	function estadoClass(est) {
		return { 'Abierto':'abierto','En investigación':'investigacion','Cerrado':'cerrado' }[est] || 'abierto';
	}

	/* ── Render un incidente ─────────────────────────────── */
	function renderCard(inc) {
		const sc  = sevClass(inc.severidad);
		const ec  = estadoClass(inc.estado);

		/* Sanitizar antes de insertar */
		const desc  = DOMPurify.sanitize(inc.descripcion || '—', { ALLOWED_TAGS: [] });
		const num   = DOMPurify.sanitize(inc.numero      || '—', { ALLOWED_TAGS: [] });
		const ubic  = DOMPurify.sanitize(inc.ubicacion   || '—', { ALLOWED_TAGS: [] });
		const sev   = DOMPurify.sanitize(inc.severidad   || '—', { ALLOWED_TAGS: [] });
		const est   = DOMPurify.sanitize(inc.estado      || '—', { ALLOWED_TAGS: [] });
		const fecha = fmtFecha(inc.fecha_hora);

		const a = document.createElement('a');
		a.href      = '/incidente-detalle.html?id=' + encodeURIComponent(inc.id);
		a.className = 'incidente-card incidente-card--' + sc;
		a.setAttribute('role', 'listitem');
		a.setAttribute('aria-label', 'Incidente ' + num + ': ' + desc.substring(0, 60));

		a.innerHTML = DOMPurify.sanitize(
			'<div class="incidente-card__header">' +
				'<span class="incidente-card__num">' + num + '</span>' +
				'<div class="incidente-card__badges">' +
					'<span class="chip chip--' + sc + '">' + sev + '</span>' +
					'<span class="chip chip--' + ec + '">' + est + '</span>' +
				'</div>' +
			'</div>' +
			'<p class="incidente-card__desc">' + desc + '</p>' +
			'<div class="incidente-card__meta">' +
				'<span class="incidente-card__meta-item">' +
					'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
					fecha +
				'</span>' +
				'<span class="incidente-card__meta-item">' +
					'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
					ubic +
				'</span>' +
			'</div>',
			{
				ALLOWED_TAGS: ['div','span','p','svg','rect','line','path','circle'],
				ALLOWED_ATTR: ['class','role','aria-label','aria-hidden','viewBox','fill','stroke','stroke-width','x','y','x1','y1','x2','y2','width','height','rx','d','cx','cy','r','points']
			}
		);

		return a;
	}

	/* ── Aplicar filtro ──────────────────────────────────── */
	function filtrar(datos) {
		if (_filtroActual === 'todos') return datos;
		/* Filtro por estado */
		if (['Abierto','En investigación','Cerrado'].includes(_filtroActual)) {
			return datos.filter(r => r.estado === _filtroActual);
		}
		/* Filtro por severidad */
		if (['Grave','Catastrófico'].includes(_filtroActual)) {
			return datos.filter(r => r.severidad === _filtroActual);
		}
		return datos;
	}

	/* ── Renderizar lista ────────────────────────────────── */
	function renderLista(datos) {
		const main = $('list-main');
		if (!main) return;

		main.innerHTML = '';

		const filtrados = filtrar(datos);

		if (filtrados.length === 0) {
			main.innerHTML = DOMPurify.sanitize(
				'<div class="empty-full">' +
				'<span style="font-size:48px;opacity:0.4;" aria-hidden="true">🛡️</span>' +
				'<p style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;color:var(--color-text-muted);">Sin incidentes</p>' +
				'<p style="font-size:var(--text-sm);color:var(--color-text-muted);">No hay incidentes con este filtro.</p>' +
				'</div>',
				{ ALLOWED_TAGS: ['div','span','p'], ALLOWED_ATTR: ['style','aria-hidden'] }
			);
			return;
		}

		const frag = document.createDocumentFragment();
		filtrados.forEach(inc => frag.appendChild(renderCard(inc)));
		main.appendChild(frag);
	}

	/* ── Cargar incidentes desde Supabase ────────────────── */
	async function cargar() {
		if (_cargando) return;
		_cargando = true;
		setSyncBadge('loading');

		try {
			const token = window.ATSHEL_AUTH.getAccessToken();
			const url   = window.__ATSHEL_CONFIG.supabaseUrl +
				'/rest/v1/incidentes' +
				'?select=id,numero,tipo,severidad,descripcion,fecha_hora,ubicacion,estado,estado_aprobacion' +
				'&deleted_at=is.null' +
				'&order=fecha_hora.desc' +
				'&limit=50';

			const res = await fetch(url, {
				headers: {
					'apikey':        window.__ATSHEL_CONFIG.supabaseKey,
					'Authorization': 'Bearer ' + (token || ''),
					'Accept':        'application/json'
				}
			});

			if (!res.ok) throw new Error('HTTP ' + res.status);

			_todos = await res.json() || [];
			renderLista(_todos);
			setSyncBadge(navigator.onLine ? 'ok' : 'offline');

		} catch (err) {
			console.error('[Incidentes] Error cargando:', err);
			setSyncBadge('offline');

			const main = $('list-main');
			if (main) {
				main.innerHTML = DOMPurify.sanitize(
					'<div class="empty-full">' +
					'<span style="font-size:48px;opacity:0.4;" aria-hidden="true">⚠️</span>' +
					'<p style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;color:var(--color-text-muted);">Error al cargar</p>' +
					'<p style="font-size:var(--text-sm);color:var(--color-text-muted);">Verificá tu conexión e intentá de nuevo.</p>' +
					'</div>',
					{ ALLOWED_TAGS: ['div','span','p'], ALLOWED_ATTR: ['style','aria-hidden'] }
				);
			}
		} finally {
			_cargando = false;
		}
	}

	/* ── Init filtros ────────────────────────────────────── */
	function initFiltros() {
		document.querySelectorAll('.filter-chip').forEach(chip => {
			chip.addEventListener('click', () => {
				/* Desactivar todos */
				document.querySelectorAll('.filter-chip').forEach(c => {
					c.classList.remove('filter-chip--active');
					c.setAttribute('aria-pressed', 'false');
				});
				/* Activar este */
				chip.classList.add('filter-chip--active');
				chip.setAttribute('aria-pressed', 'true');
				_filtroActual = chip.getAttribute('data-filtro') || 'todos';
				renderLista(_todos);
			});
		});
	}

	/* ── Init ────────────────────────────────────────────── */
	async function init() {

		/* 1. Guard de sesión */
		try {
			const session = await window.ATSHEL_AUTH.getSession();
			if (!session?.user) {
				window.location.replace('/login.html');
				return;
			}
		} catch (_) {
			window.location.replace('/login.html');
			return;
		}

		/* 2. Conectividad */
		window.addEventListener('online',  () => { setSyncBadge('ok');      cargar(); });
		window.addEventListener('offline', () => { setSyncBadge('offline'); });
		if (!navigator.onLine) setSyncBadge('offline');

		/* 3. Filtros */
		initFiltros();

		/* 4. Cargar datos */
		await cargar();
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init);
	} else {
		init();
	}

})();
</script>

</body>
</html>
