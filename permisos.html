<!DOCTYPE html>
<html lang="es-AR" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0A0C0E">
	<meta name="description" content="ATSHEL HSE Manager — Permisos de trabajo">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="manifest" href="/manifest.json">
	<link rel="apple-touch-icon" href="/icons/icon-192.png">

	<title>Permisos — ATSHEL HSE</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/css/atshel-theme.css">

	<style>
		/* ── Layout ───────────────────────────────────────────── */
		.app {
			display:        flex;
			flex-direction: column;
			min-height:     100dvh;
			background:     var(--surface-base);
		}

		/* ── App header ───────────────────────────────────────── */
		.app-header {
			position:        sticky;
			top:             0;
			z-index:         200;
			background:      var(--surface-01);
			border-bottom:   1px solid var(--border-subtle);
			padding-top:     env(safe-area-inset-top);
		}

		.app-header__row {
			display:         flex;
			align-items:     center;
			justify-content: space-between;
			padding:         0 16px;
			height:          56px;
		}

		.app-header__left {
			display:     flex;
			align-items: center;
			gap:         8px;
		}

		.btn-back {
			display:         flex;
			align-items:     center;
			justify-content: center;
			width:           36px;
			height:          36px;
			border-radius:   8px;
			background:      transparent;
			border:          none;
			color:           var(--text-secondary);
			cursor:          pointer;
			transition:      background 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-back:hover       { background: var(--surface-03); }
		.btn-back:active      { background: var(--surface-04); }

		.app-header__title {
			font-family:  var(--font-condensed);
			font-size:    var(--text-xl);
			font-weight:  700;
			color:        var(--text-primary);
			line-height:  1;
		}

		.btn-nuevo {
			display:       flex;
			align-items:   center;
			gap:           5px;
			padding:       8px 14px;
			border-radius: 8px;
			background:    var(--accent);
			border:        none;
			color:         #000;
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			font-weight:   700;
			cursor:        pointer;
			transition:    background 0.15s ease, transform 0.1s ease;
			-webkit-tap-highlight-color: transparent;
			text-decoration: none;
			white-space:   nowrap;
		}
		.btn-nuevo:hover  { background: var(--accent-hover); }
		.btn-nuevo:active { transform: scale(0.97); }

		/* ── Barra de búsqueda + filtros (sticky bajo header) ─── */
		.filters-bar {
			position:        sticky;
			top:             calc(56px + env(safe-area-inset-top));
			z-index:         100;
			background:      var(--surface-01);
			border-bottom:   1px solid var(--border-subtle);
			display:         flex;
			flex-direction:  column;
			gap:             10px;
			padding:         10px 16px;
		}

		.search-wrap {
			display:       flex;
			align-items:   center;
			gap:           8px;
			background:    var(--surface-02);
			border:        1px solid var(--border-subtle);
			border-radius: 8px;
			padding:       0 12px;
			height:        40px;
			transition:    border-color 0.15s ease;
		}
		.search-wrap:focus-within {
			border-color: var(--accent);
		}

		.search-wrap__icon {
			color:      var(--text-tertiary);
			flex-shrink: 0;
			line-height: 0;
		}

		#search-input {
			flex:        1;
			background:  transparent;
			border:      none;
			outline:     none;
			font-family: var(--font-sans);
			font-size:   var(--text-base);
			color:       var(--text-primary);
			min-width:   0;
		}
		#search-input::placeholder { color: var(--text-tertiary); }

		.btn-clear-search {
			display:         flex;
			align-items:     center;
			justify-content: center;
			width:           24px;
			height:          24px;
			border-radius:   50%;
			background:      var(--surface-04);
			border:          none;
			color:           var(--text-secondary);
			font-size:       14px;
			cursor:          pointer;
			flex-shrink:     0;
			-webkit-tap-highlight-color: transparent;
		}

		/* ── Filter chips ─────────────────────────────────────── */
		.filter-chips {
			display:        flex;
			gap:            6px;
			overflow-x:     auto;
			scrollbar-width: none;
			-webkit-overflow-scrolling: touch;
			padding-bottom: 2px;
		}
		.filter-chips::-webkit-scrollbar { display: none; }

		.filter-chip {
			flex-shrink:   0;
			padding:       5px 12px;
			border-radius: 20px;
			border:        1px solid var(--border-subtle);
			background:    var(--surface-02);
			color:         var(--text-secondary);
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			font-weight:   600;
			cursor:        pointer;
			transition:    background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
			white-space:   nowrap;
			-webkit-tap-highlight-color: transparent;
		}
		.filter-chip:hover {
			background:    var(--surface-03);
			color:         var(--text-primary);
		}
		.filter-chip[aria-pressed="true"],
		.filter-chip--active {
			background:    var(--accent-subtle);
			border-color:  var(--accent-subtle-hover);
			color:         var(--accent);
		}

		/* ── Contenido principal ──────────────────────────────── */
		.list-main {
			flex:           1;
			padding:        12px 16px calc(80px + env(safe-area-inset-bottom));
			display:        flex;
			flex-direction: column;
			gap:            8px;
		}

		/* ── Contador de resultados ───────────────────────────── */
		.results-count {
			font-size:  var(--text-sm);
			color:      var(--text-tertiary);
			padding:    4px 0;
			font-family: var(--font-mono);
		}

		/* ── Item de permiso ───────────────────────────────────── */
		.pt-item {
			display:        flex;
			align-items:    flex-start;
			gap:            12px;
			padding:        14px;
			background:     var(--surface-02);
			border:         1px solid var(--border-subtle);
			border-radius:  10px;
			text-decoration: none;
			transition:     background 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.pt-item:hover,
		.pt-item:focus-visible { background: var(--surface-03); }
		.pt-item:active         { background: var(--surface-04); }

		.pt-item__icon {
			width:           36px;
			height:          36px;
			border-radius:   8px;
			display:         flex;
			align-items:     center;
			justify-content: center;
			font-size:       16px;
			flex-shrink:     0;
		}
		.pt-item__icon--danger  { background: var(--color-danger-bg);  }
		.pt-item__icon--warning { background: var(--color-warning-bg); }
		.pt-item__icon--success { background: var(--color-success-bg); }
		.pt-item__icon--info    { background: var(--color-info-bg);    }
		.pt-item__icon--neutral { background: var(--surface-04);       }

		.pt-item__body { flex: 1; min-width: 0; }

		.pt-item__header {
			display:         flex;
			justify-content: space-between;
			align-items:     flex-start;
			gap:             8px;
			margin-bottom:   4px;
		}

		.pt-item__tipo {
			font-family:  var(--font-mono);
			font-size:    var(--text-xs);
			font-weight:  500;
			color:        var(--text-tertiary);
			white-space:  nowrap;
			flex-shrink:  0;
		}

		.pt-item__desc {
			font-size:     var(--text-base);
			font-weight:   600;
			color:         var(--text-primary);
			line-height:   1.35;
			white-space:   nowrap;
			overflow:      hidden;
			text-overflow: ellipsis;
		}

		.pt-item__meta {
			display:     flex;
			flex-wrap:   wrap;
			align-items: center;
			gap:         5px;
			margin-top:  5px;
		}

		.pt-item__date {
			font-size:   var(--text-xs);
			color:       var(--text-tertiary);
			font-family: var(--font-mono);
		}

		.pt-item__place {
			font-size:     var(--text-xs);
			color:         var(--text-tertiary);
			white-space:   nowrap;
			overflow:      hidden;
			text-overflow: ellipsis;
			max-width:     120px;
		}

		.pt-item__sep {
			color:       var(--text-tertiary);
			font-size:   var(--text-xs);
		}

		/* ── Chips ────────────────────────────────────────────── */
		.chip {
			display:        inline-flex;
			align-items:    center;
			padding:        2px 6px;
			border-radius:  4px;
			font-size:      10px;
			font-weight:    600;
			line-height:    1.4;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			flex-shrink:    0;
		}
		.chip--danger   { background: var(--color-danger-bg);  color: var(--color-danger);  }
		.chip--warning  { background: var(--color-warning-bg); color: var(--color-warning); }
		.chip--success  { background: var(--color-success-bg); color: var(--color-success); }
		.chip--info     { background: var(--color-info-bg);    color: var(--color-info);    }
		.chip--neutral  { background: var(--surface-04);       color: var(--text-secondary);}

		/* ── Skeletons ────────────────────────────────────────── */
		.skeleton-item {
			height:        76px;
			border-radius: 10px;
			background:    var(--surface-02);
			animation:     shimmer 1.5s ease-in-out infinite;
		}
		@keyframes shimmer {
			0%, 100% { opacity: 0.8; }
			50%       { opacity: 0.4; }
		}

		/* ── Botón cargar más ─────────────────────────────────── */
		.btn-load-more {
			width:         100%;
			padding:       12px;
			border-radius: 8px;
			background:    var(--surface-02);
			border:        1px solid var(--border-subtle);
			color:         var(--text-secondary);
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			font-weight:   600;
			cursor:        pointer;
			transition:    background 0.15s ease;
			margin-top:    4px;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-load-more:hover  { background: var(--surface-03); }
		.btn-load-more:active { background: var(--surface-04); }
		.btn-load-more:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		/* ── Estado vacío / error ─────────────────────────────── */
		.empty-state {
			padding:       48px 24px;
			text-align:    center;
			display:       flex;
			flex-direction: column;
			align-items:   center;
			gap:           8px;
		}
		.empty-state__icon { font-size: 36px; }
		.empty-state__title {
			font-family: var(--font-condensed);
			font-size:   var(--text-xl);
			font-weight: 700;
			color:       var(--text-secondary);
		}
		.empty-state__sub {
			font-size: var(--text-sm);
			color:     var(--text-tertiary);
		}

		/* ── Sync badge ───────────────────────────────────────── */
		.sync-badge {
			display:       flex;
			align-items:   center;
			gap:           5px;
			padding:       4px 8px;
			border-radius: 20px;
			font-family:   var(--font-mono);
			font-size:     10px;
			font-weight:   500;
		}
		.sync-badge--ok      { background: var(--color-success-bg); color: var(--color-success); }
		.sync-badge--pending { background: var(--color-warning-bg); color: var(--color-warning); }
		.sync-badge--offline { background: var(--color-danger-bg);  color: var(--color-danger);  }
		.sync-badge__dot {
			width: 6px; height: 6px;
			border-radius: 50%;
			background: currentColor;
		}

		/* ── Bottom nav ───────────────────────────────────────── */
		.bottom-nav {
			position:        fixed;
			bottom:          0;
			left:            0;
			right:           0;
			z-index:         200;
			display:         flex;
			background:      var(--surface-01);
			border-top:      1px solid var(--border-subtle);
			padding-bottom:  env(safe-area-inset-bottom);
		}
		.bottom-nav__item {
			flex:            1;
			display:         flex;
			flex-direction:  column;
			align-items:     center;
			justify-content: center;
			gap:             3px;
			padding:         8px 4px;
			min-height:      56px;
			color:           var(--text-tertiary);
			text-decoration: none;
			font-size:       10px;
			font-weight:     600;
			transition:      color 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.bottom-nav__item--active { color: var(--accent); }
		.bottom-nav__icon {
			display: flex;
			line-height: 0;
		}
		.bottom-nav__item--active .bottom-nav__icon { background: var(--accent-subtle); border-radius: 8px; padding: 4px; margin: -4px; }
	</style>
</head>
<body>
<div class="app">

	<!-- ── Header ──────────────────────────────────────────── -->
	<header class="app-header" role="banner">
		<div class="app-header__row">
			<div class="app-header__left">
				<a href="/dashboard.html" class="btn-back" aria-label="Volver al panel">
					<svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
						<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/>
					</svg>
				</a>
				<h1 class="app-header__title">Permisos</h1>
			</div>

			<div style="display:flex;align-items:center;gap:10px">
				<div
					id="sync-badge"
					class="sync-badge sync-badge--pending"
					aria-live="polite"
					aria-label="Estado de sincronización"
				>
					<span class="sync-badge__dot" aria-hidden="true"></span>
					<span id="sync-text">...</span>
				</div>

				<a
					href="/permiso-nuevo.html"
					class="btn-nuevo"
					aria-label="Solicitar nuevo permiso de trabajo"
				>
					+ Nuevo
				</a>
			</div>
		</div>
	</header>

	<!-- ── Búsqueda y filtros ──────────────────────────────── -->
	<div class="filters-bar" role="search">

		<div class="search-wrap">
			<span class="search-wrap__icon" aria-hidden="true">
				<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
					<path d="M229.66,218.34l-50.07-50.07a88.21,88.21,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.31ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
				</svg>
			</span>
			<input
				id="search-input"
				type="search"
				inputmode="search"
				autocomplete="off"
				autocorrect="off"
				spellcheck="false"
				placeholder="Buscar por descripción o ubicación..."
				aria-label="Buscar permisos de trabajo"
			>
			<button
				id="btn-clear-search"
				class="btn-clear-search"
				aria-label="Limpiar búsqueda"
				hidden
			>✕</button>
		</div>

		<div
			class="filter-chips"
			role="group"
			aria-label="Filtrar por estado"
			id="filter-chips"
		>
			<button class="filter-chip filter-chip--active" data-estado=""             aria-pressed="true">Todos</button>
			<button class="filter-chip"                     data-estado="Solicitado"   aria-pressed="false">Solicitado</button>
			<button class="filter-chip"                     data-estado="En_revision"  aria-pressed="false">En revisión</button>
			<button class="filter-chip"                     data-estado="Aprobado"     aria-pressed="false">Aprobado</button>
			<button class="filter-chip"                     data-estado="Activo"       aria-pressed="false">Activo</button>
			<button class="filter-chip"                     data-estado="Suspendido"   aria-pressed="false">Suspendido</button>
			<button class="filter-chip"                     data-estado="Cerrado"      aria-pressed="false">Cerrado</button>
			<button class="filter-chip"                     data-estado="Cancelado"    aria-pressed="false">Cancelado</button>
		</div>
	</div>

	<!-- ── Lista ───────────────────────────────────────────── -->
	<main class="list-main" id="main-content" role="main">
		<p id="results-count" class="results-count" aria-live="polite" aria-atomic="true"></p>

		<div id="list-container" aria-live="polite" aria-label="Lista de permisos de trabajo">
			<!-- Skeletons mientras carga -->
			<div class="skeleton-item"></div>
			<div class="skeleton-item"></div>
			<div class="skeleton-item"></div>
			<div class="skeleton-item"></div>
		</div>

		<button
			id="btn-load-more"
			class="btn-load-more"
			hidden
			aria-label="Cargar más permisos"
		>
			Cargar más
		</button>
	</main>

	<!-- ── Barra de navegación inferior ─────────────────────── -->
	<nav class="bottom-nav" aria-label="Navegación principal">

		<a href="/dashboard.html" class="bottom-nav__item" aria-label="Inicio">
			<span class="bottom-nav__icon" aria-hidden="true">
				<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor">
					<path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48a16,16,0,0,1,21.66,0l80,75.48A16,16,0,0,1,224,115.55Z"/>
				</svg>
			</span>
			<span>Inicio</span>
		</a>

		<a href="/incidentes.html" class="bottom-nav__item" aria-label="Incidentes">
			<span class="bottom-nav__icon" aria-hidden="true">
				<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor">
					<path d="M236.8,188.09,149.35,36.22a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM120,104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm8,88a12,12,0,1,1,12-12A12,12,0,0,1,128,192Z"/>
				</svg>
			</span>
			<span>Incidentes</span>
		</a>

		<a href="/ats-nuevo.html" class="bottom-nav__item" aria-label="ATS">
			<span class="bottom-nav__icon" aria-hidden="true">
				<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor">
					<path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM40,64H216V80H40ZM216,192H40V96H216Zm-32-72a8,8,0,0,1-8,8H136a8,8,0,0,1,0-16h40A8,8,0,0,1,184,120Zm0,32a8,8,0,0,1-8,8H136a8,8,0,0,1,0-16h40A8,8,0,0,1,184,152ZM96,120a8,8,0,0,1-8,8H80v8a8,8,0,0,1-16,0v-8H56a8,8,0,0,1,0-16H64v-8a8,8,0,0,1,16,0v8h8A8,8,0,0,1,96,120Z"/>
				</svg>
			</span>
			<span>ATS</span>
		</a>

		<a href="/permisos.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page" aria-label="Permisos">
			<span class="bottom-nav__icon" aria-hidden="true">
				<svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="76" cy="76" r="36"/>
					<line x1="102" y1="102" x2="208" y2="208"/>
					<line x1="160" y1="160" x2="184" y2="136"/>
					<line x1="184" y1="184" x2="208" y2="160"/>
				</svg>
			</span>
			<span>Permisos</span>
		</a>

		<a href="/accion-nueva.html" class="bottom-nav__item" aria-label="Acciones">
			<span class="bottom-nav__icon" aria-hidden="true">
				<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor">

<!-- ── Módulo ─────────────────────────────────────────── -->
<script type="module">
	/**
	 * permisos.html — lista de Permisos de Trabajo, paginada con búsqueda y filtros.
	 *
	 * Este archivo NO EXISTÍA — el nav (dashboard, barra inferior) ya apuntaba
	 * a /permisos.html desde antes, por lo que tapear "Permisos" daba 404 real.
	 * Necesita su entrada en vite.config.js (rollupOptions.input) para buildear.
	 *
	 * Columnas verificadas MCP 2026-08-12 (Claude.md está desactualizado acá,
	 * no confiar en ese archivo para este módulo):
	 *   permisos_trabajo.estado        TEXT CHECK IN
	 *     ('Solicitado','En_revision','Aprobado','Activo','Suspendido','Cerrado','Cancelado')
	 *     — Claude.md documenta solo 4 valores. Son 7.
	 *   permisos_trabajo.tipo_permiso  TEXT CHECK IN
	 *     ('General','Trabajo_en_Caliente','Trabajo_en_Frio','Trabajo_en_Altura',
	 *      'Espacio_Confinado','Excavacion','Electrico')
	 *   permisos_trabajo.deleted_at    TIMESTAMPTZ (soft-delete)
	 *   permisos_trabajo.fecha_inicio / fecha_fin  TIMESTAMPTZ NOT NULL
	 *
	 * RLS (verificado en vivo):
	 *   permisos_select → cualquier usuario de la empresa ve TODOS los permisos
	 *     (no solo los propios). No hace falta filtrar por solicitado_por acá.
	 *   pt_insert → cualquier usuario de la empresa puede crear (técnicos incluidos).
	 *   pt_update → SOLO supervisor/administrador. Los botones de aprobar/cerrar
	 *     van en permiso-detalle.html (próxima entrega), no en esta lista.
	 *
	 * Enlaza a /permiso-nuevo.html y /permiso-detalle.html?id=... — TODAVÍA NO
	 * EXISTEN, son las próximas dos entregas. Hasta subirlos, esos dos enlaces
	 * van a dar 404 — es esperado, no es un bug nuevo.
	 */

	import {
		supabase,
		requireAuth,
	} from '/src/js/atshel-supabase.js';

	import {
		sanitizeHTML,
		formatFechaCorta,
	} from '/src/js/atshel-core.js';

	// ── Constantes ───────────────────────────────────────────
	const PAGE_SIZE = 20;

	// ── Estado ───────────────────────────────────────────────
	let _offset       = 0;
	let _total        = 0;
	let _filtroEstado = '';
	let _busqueda     = '';
	let _cargando     = false;

	// ── Referencias al DOM ───────────────────────────────────
	const searchInputEl   = document.getElementById('search-input');
	const btnClearEl      = document.getElementById('btn-clear-search');
	const filterChipsEl   = document.getElementById('filter-chips');
	const listContainerEl = document.getElementById('list-container');
	const resultCountEl   = document.getElementById('results-count');
	const btnLoadMoreEl   = document.getElementById('btn-load-more');
	const syncBadgeEl     = document.getElementById('sync-badge');
	const syncTextEl      = document.getElementById('sync-text');

	// ── Debounce ─────────────────────────────────────────────
	function debounce(fn, ms) {
		let timer;
		return (...args) => {
			clearTimeout(timer);
			timer = setTimeout(() => fn(...args), ms);
		};
	}

	// ── Sync badge ───────────────────────────────────────────
	function updateSyncBadge(estado) {
		const clases = { ok: 'sync-badge sync-badge--ok', pending: 'sync-badge sync-badge--pending', offline: 'sync-badge sync-badge--offline' };
		const textos = { ok: 'Sincronizado', pending: 'Sincronizando...', offline: 'Sin conexión' };
		syncBadgeEl.className  = clases[estado] ?? clases.pending;
		syncTextEl.textContent = textos[estado]  ?? textos.pending;
	}

	// ── Tipo de permiso: ícono + etiqueta ────────────────────
	const TIPO_ICON = {
		'General':             '📄',
		'Trabajo_en_Caliente': '🔥',
		'Trabajo_en_Frio':     '🧰',
		'Trabajo_en_Altura':   '🧗',
		'Espacio_Confinado':   '🕳️',
		'Excavacion':          '⛏️',
		'Electrico':           '⚡',
	};

	const TIPO_LABEL = {
		'General':             'General',
		'Trabajo_en_Caliente': 'Trabajo en caliente',
		'Trabajo_en_Frio':     'Trabajo en frío',
		'Trabajo_en_Altura':   'Trabajo en altura',
		'Espacio_Confinado':   'Espacio confinado',
		'Excavacion':          'Excavación',
		'Electrico':           'Eléctrico',
	};

	// ── Estado del permiso: chip + color de ícono ────────────
	const ESTADO_MAP = {
		'Solicitado':  ['info',    'Solicitado'],
		'En_revision': ['warning', 'En revisión'],
		'Aprobado':    ['info',    'Aprobado'],
		'Activo':      ['success', 'Activo'],
		'Suspendido':  ['warning', 'Suspendido'],
		'Cerrado':     ['neutral', 'Cerrado'],
		'Cancelado':   ['danger',  'Cancelado'],
	};

	function chip(value, map, fallbackClass = 'neutral') {
		const [cls, label] = map[value] || [fallbackClass, value || '—'];
		return `<span class="chip chip--${cls}">${sanitizeHTML(label)}</span>`;
	}

	function formatRango(inicio, fin) {
		const a = inicio ? formatFechaCorta(inicio) : '—';
		const b = fin    ? formatFechaCorta(fin)    : '—';
		return `${a} – ${b}`;
	}

	// ── Render de un item ─────────────────────────────────────
	function renderItem(pt) {
		const icono       = TIPO_ICON[pt.tipo_permiso] || '📄';
		const tipoLabel   = TIPO_LABEL[pt.tipo_permiso] || pt.tipo_permiso || '—';
		const [iconCls]   = ESTADO_MAP[pt.estado] || ['neutral'];
		const desc        = pt.descripcion ? sanitizeHTML(pt.descripcion.substring(0, 90)) : '—';
		const lugar       = pt.ubicacion
			? `<span class="pt-item__sep">·</span><span class="pt-item__place">${sanitizeHTML(pt.ubicacion)}</span>`
			: '';

		return `
		<a
			href="/permiso-detalle.html?id=${sanitizeHTML(pt.id)}"
			class="pt-item"
			aria-label="Permiso ${sanitizeHTML(tipoLabel)}: ${sanitizeHTML(pt.descripcion?.substring(0,60) ?? '—')}"
		>
			<div class="pt-item__icon pt-item__icon--${iconCls}" aria-hidden="true">${icono}</div>
			<div class="pt-item__body">
				<div class="pt-item__header">
					<div class="pt-item__desc">${desc}</div>
					<span class="pt-item__tipo">${sanitizeHTML(tipoLabel)}</span>
				</div>
				<div class="pt-item__meta">
					${chip(pt.estado, ESTADO_MAP)}
					<span class="pt-item__date">${formatRango(pt.fecha_inicio, pt.fecha_fin)}</span>
					${lugar}
				</div>
			</div>
		</a>`;
	}

	// ── Render: vacío ─────────────────────────────────────────
	function renderEmpty(busqueda, filtro) {
		const esFiltrado = busqueda || filtro;
		return `
		<div class="empty-state">
			<div class="empty-state__icon">${esFiltrado ? '🔍' : '🔑'}</div>
			<div class="empty-state__title">
				${esFiltrado ? 'Sin resultados' : 'Sin permisos'}
			</div>
			<div class="empty-state__sub">
				${esFiltrado
					? 'Probá con otros filtros o términos de búsqueda.'
					: 'Cuando se solicite un permiso de trabajo aparecerá acá.'}
			</div>
		</div>`;
	}

	// ── Render: error ─────────────────────────────────────────
	function renderError(msg) {
		return `
		<div class="empty-state">
			<div class="empty-state__icon">⚡</div>
			<div class="empty-state__title">Error al cargar</div>
			<div class="empty-state__sub">${sanitizeHTML(msg)}</div>
		</div>`;
	}

	// ── Skeletons durante carga ───────────────────────────────
	function showSkeletons(n = 4) {
		listContainerEl.innerHTML = Array(n).fill('<div class="skeleton-item"></div>').join('');
	}

	// ── Actualizar contador ───────────────────────────────────
	function updateCount() {
		const showing = listContainerEl.querySelectorAll('.pt-item').length;
		if (_total === 0) {
			resultCountEl.textContent = '';
		} else {
			resultCountEl.textContent = `${showing} de ${_total} permiso${_total !== 1 ? 's' : ''}`;
		}
	}

	// ── Query principal ───────────────────────────────────────
	function buildQuery(forCount = false) {
		let q = supabase
			.from('permisos_trabajo')
			.select(
				forCount
					? 'id'
					: 'id, tipo_permiso, descripcion, ubicacion, fecha_inicio, fecha_fin, estado',
				forCount ? { count: 'exact', head: true } : { count: 'exact' }
			)
			.is('deleted_at', null);

		if (_filtroEstado) {
			q = q.eq('estado', _filtroEstado);
		}

		const termino = _busqueda.trim();
		if (termino) {
			q = q.or(`descripcion.ilike.%${termino}%,ubicacion.ilike.%${termino}%`);
		}

		return q;
	}

	// ── Carga (reset = primera página, false = página siguiente) ─
	async function cargar(reset = false) {
		if (_cargando) return;
		if (reset) _offset = 0;

		_cargando = true;
		btnLoadMoreEl.disabled = true;

		if (reset) showSkeletons();

		const { data, count, error } = await buildQuery()
			.order('fecha_inicio', { ascending: false, nullsFirst: false })
			.range(_offset, _offset + PAGE_SIZE - 1);

		_cargando = false;

		if (error) {
			listContainerEl.innerHTML = renderError(
				navigator.onLine
					? 'No se pudo conectar al servidor.'
					: 'Sin conexión. Reconectate para ver los permisos.'
			);
			btnLoadMoreEl.hidden = true;
			return;
		}

		_total = count ?? 0;

		if (reset) {
			if (!data || data.length === 0) {
				listContainerEl.innerHTML = renderEmpty(_busqueda, _filtroEstado);
				btnLoadMoreEl.hidden = true;
				updateCount();
				return;
			}
			listContainerEl.innerHTML = data.map(renderItem).join('');
		} else {
			if (data && data.length > 0) {
				listContainerEl.insertAdjacentHTML('beforeend', data.map(renderItem).join(''));
			}
		}

		_offset += data?.length ?? 0;
		updateCount();

		const hayMas = _offset < _total;
		btnLoadMoreEl.hidden   = !hayMas;
		btnLoadMoreEl.disabled = false;
	}

	// ── Cambiar filtro de estado ──────────────────────────────
	function setFiltroEstado(estado) {
		_filtroEstado = estado;

		filterChipsEl.querySelectorAll('.filter-chip').forEach(chip => {
			const activo = chip.dataset.estado === estado;
			chip.setAttribute('aria-pressed', String(activo));
			chip.classList.toggle('filter-chip--active', activo);
		});

		cargar(true);
	}

	// ── Init ─────────────────────────────────────────────────
	async function init() {
		// 1. Verificar sesión
		await requireAuth('/login.html');

		// 2. Estado de red
		updateSyncBadge(navigator.onLine ? 'ok' : 'offline');

		// 3. Carga inicial
		await cargar(true);

		// 4. Event listeners — todos aquí, una sola vez
		const debouncedBuscar = debounce(() => {
			_busqueda = searchInputEl.value;
			btnClearEl.hidden = !_busqueda;
			cargar(true);
		}, 350);

		searchInputEl.addEventListener('input', debouncedBuscar);

		btnClearEl.addEventListener('click', () => {
			searchInputEl.value = '';
			_busqueda           = '';
			btnClearEl.hidden   = true;
			searchInputEl.focus();
			cargar(true);
		});

		filterChipsEl.addEventListener('click', (e) => {
			const chip = e.target.closest('.filter-chip[data-estado]');
			if (!chip) return;
			setFiltroEstado(chip.dataset.estado);
		});

		btnLoadMoreEl.addEventListener('click', () => cargar(false));

		window.addEventListener('online',  () => updateSyncBadge('ok'));
		window.addEventListener('offline', () => updateSyncBadge('offline'));
	}

	init();
</script>
</body>
</html>
