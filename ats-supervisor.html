<!DOCTYPE html>
<html lang="es-AR" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0A0C0E">
	<meta name="description" content="ATSHEL HSE — Revisión y firma de ATS">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<link rel="manifest" href="/manifest.json">
	<link rel="apple-touch-icon" href="/icons/icon-192.png">

	<title>Revisar ATS — ATSHEL HSE</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/css/atshel-theme.css">

	<style>
		/* ── Layout ───────────────────────────────────────────── */
		.app {
			display:        flex;
			flex-direction: column;
			min-height:     100dvh;
			background:     var(--surface-base);
		}

		/* ── Header ───────────────────────────────────────────── */
		.app-header {
			position:        sticky;
			top:             0;
			z-index:         100;
			display:         flex;
			align-items:     center;
			justify-content: space-between;
			padding:         0 16px;
			height:          56px;
			background:      var(--surface-01);
			border-bottom:   1px solid var(--border-subtle);
			padding-top:     env(safe-area-inset-top);
			gap:             8px;
		}

		.app-header__left {
			display:     flex;
			align-items: center;
			gap:         8px;
			min-width:   0;
		}

		.btn-back {
			display:         flex;
			align-items:     center;
			justify-content: center;
			width:           36px;
			height:          36px;
			border-radius:   8px;
			background:      transparent;
			border:          none;
			color:           var(--text-secondary);
			cursor:          pointer;
			flex-shrink:     0;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-back:active { background: var(--surface-04); }

		.app-header__title {
			font-family:   var(--font-condensed);
			font-size:     var(--text-xl);
			font-weight:   700;
			color:         var(--text-primary);
			line-height:   1;
			overflow:      hidden;
			text-overflow: ellipsis;
			white-space:   nowrap;
		}

		/* ── Chip ─────────────────────────────────────────────── */
		.chip {
			display:        inline-flex;
			align-items:    center;
			padding:        3px 8px;
			border-radius:  4px;
			font-size:      10px;
			font-weight:    700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			white-space:    nowrap;
			flex-shrink:    0;
		}
		.chip--danger  { background: var(--color-danger-bg);  color: var(--color-danger);  }
		.chip--warning { background: var(--color-warning-bg); color: var(--color-warning); }
		.chip--success { background: var(--color-success-bg); color: var(--color-success); }
		.chip--info    { background: var(--color-info-bg);    color: var(--color-info);    }
		.chip--neutral { background: var(--surface-04);       color: var(--text-secondary);}

		/* ── Main ─────────────────────────────────────────────── */
		.detail-main {
			flex:           1;
			padding:        16px 16px 40px;
			display:        flex;
			flex-direction: column;
			gap:            16px;
		}

		/* ── Cards ────────────────────────────────────────────── */
		.card {
			background:    var(--surface-02);
			border:        1px solid var(--border-subtle);
			border-radius: 10px;
			overflow:      hidden;
		}

		.card__header {
			display:         flex;
			align-items:     center;
			justify-content: space-between;
			padding:         12px 16px;
			border-bottom:   1px solid var(--border-subtle);
		}

		.card__title {
			font-family:  var(--font-condensed);
			font-size:    var(--text-lg);
			font-weight:  700;
			color:        var(--text-primary);
			line-height:  1;
		}

		/* ── Data rows ────────────────────────────────────────── */
		.data-rows { padding: 0 16px; }

		.data-row {
			display:       flex;
			gap:           12px;
			padding:       10px 0;
			border-bottom: 1px solid var(--border-subtle);
			align-items:   flex-start;
		}
		.data-row:last-child { border-bottom: none; }

		.data-row__label {
			font-size:      10px;
			font-weight:    700;
			color:          var(--text-tertiary);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			flex-shrink:    0;
			width:          90px;
			padding-top:    2px;
		}

		.data-row__value {
			font-size:  var(--text-sm);
			color:      var(--text-primary);
			line-height: 1.4;
			flex:       1;
			min-width:  0;
			word-break: break-word;
		}
		.data-row__value--mono { font-family: var(--font-mono); font-size: var(--text-xs); }

		/* ── IPERC items (read-only) ──────────────────────────── */
		.iperc-ro {
			padding:       12px 16px;
			border-bottom: 1px solid var(--border-subtle);
		}
		.iperc-ro:last-child { border-bottom: none; }

		.iperc-ro__num {
			font-family:   var(--font-condensed);
			font-size:     var(--text-base);
			font-weight:   700;
			color:         var(--text-secondary);
			margin-bottom: 8px;
		}

		.iperc-ro__grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 6px;
		}
		.iperc-ro__field { grid-column: span 2; }
		.iperc-ro__half  { }

		.iperc-ro__label {
			font-size:      9px;
			font-weight:    700;
			color:          var(--text-tertiary);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.iperc-ro__val {
			font-size:  var(--text-sm);
			color:      var(--text-primary);
			margin-top: 2px;
			line-height: 1.4;
		}

		/* ── Charla pre-trabajo ───────────────────────────────── */
		.charla-item {
			padding:       12px 16px;
			border-bottom: 1px solid var(--border-subtle);
		}
		.charla-item:last-child { border-bottom: none; }

		.charla-item__header {
			display:         flex;
			justify-content: space-between;
			align-items:     center;
			margin-bottom:   6px;
		}

		.charla-item__tipo {
			font-size:   var(--text-sm);
			font-weight: 700;
			color:       var(--text-primary);
		}

		.charla-item__meta {
			font-size:   var(--text-xs);
			color:       var(--text-tertiary);
			font-family: var(--font-mono);
		}

		.asistente-list {
			display:    flex;
			flex-wrap:  wrap;
			gap:        4px;
			margin-top: 6px;
		}

		.asistente-pill {
			padding:       2px 8px;
			border-radius: 10px;
			background:    var(--surface-04);
			font-size:     11px;
			font-weight:   600;
			color:         var(--text-secondary);
		}

		/* ── Inline form para nueva charla ────────────────────── */
		.charla-form {
			padding: 14px 16px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			border-top: 1px solid var(--border-subtle);
			background: var(--surface-03);
		}

		.field {
			display:        flex;
			flex-direction: column;
			gap:            5px;
		}

		.field__label {
			font-size:      10px;
			font-weight:    700;
			color:          var(--text-tertiary);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}
		.field__label abbr { text-decoration: none; color: var(--color-danger); margin-left: 2px; }

		.field__input,
		.field__textarea,
		.field__select {
			width:         100%;
			box-sizing:    border-box;
			background:    var(--surface-02);
			border:        1px solid var(--border-subtle);
			border-radius: 8px;
			padding:       10px 12px;
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			color:         var(--text-primary);
			outline:       none;
			transition:    border-color 0.15s ease;
			-webkit-appearance: none;
		}
		.field__textarea { resize: vertical; min-height: 60px; }
		.field__select option { background: var(--surface-02); }
		.field__input:focus,
		.field__textarea:focus,
		.field__select:focus  { border-color: var(--accent); }
		.field__input::placeholder,
		.field__textarea::placeholder { color: var(--text-tertiary); }
		.field__input[aria-invalid="true"] { border-color: var(--color-danger); }

		.field__row-2 {
			display:               grid;
			grid-template-columns: 2fr 1fr;
			gap:                   8px;
		}

		.asistente-checkboxes {
			display:        flex;
			flex-direction: column;
			gap:            6px;
			max-height:     160px;
			overflow-y:     auto;
		}

		.asistente-check {
			display:     flex;
			align-items: center;
			gap:         8px;
			padding:     8px 10px;
			background:  var(--surface-02);
			border-radius: 6px;
			cursor:      pointer;
		}

		.asistente-check input[type="checkbox"] {
			width:         18px;
			height:        18px;
			accent-color:  var(--accent);
			flex-shrink:   0;
		}

		.asistente-check__name {
			font-size:   var(--text-sm);
			color:       var(--text-primary);
			font-weight: 500;
		}

		.charla-form__actions {
			display: flex;
			gap:     8px;
		}

		.btn-cancelar-charla {
			flex:          0 0 auto;
			padding:       10px 16px;
			border-radius: 8px;
			background:    var(--surface-04);
			border:        1px solid var(--border-subtle);
			color:         var(--text-secondary);
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			font-weight:   600;
			cursor:        pointer;
			-webkit-tap-highlight-color: transparent;
		}

		.btn-guardar-charla {
			flex:          1;
			padding:       10px;
			border-radius: 8px;
			background:    var(--accent);
			border:        none;
			color:         #000;
			font-family:   var(--font-sans);
			font-size:     var(--text-sm);
			font-weight:   700;
			cursor:        pointer;
			transition:    background 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-guardar-charla:hover    { background: var(--accent-hover); }
		.btn-guardar-charla:disabled { opacity: 0.5; cursor: not-allowed; }

		.btn-add-charla {
			display:         flex;
			align-items:     center;
			justify-content: center;
			gap:             6px;
			padding:         10px;
			border-radius:   8px;
			background:      transparent;
			border:          1px dashed var(--border-subtle);
			color:           var(--text-secondary);
			font-family:     var(--font-sans);
			font-size:       var(--text-sm);
			font-weight:     600;
			cursor:          pointer;
			width:           100%;
			-webkit-tap-highlight-color: transparent;
			transition:      all 0.15s ease;
		}
		.btn-add-charla:hover { border-color: var(--accent); color: var(--accent); }

		/* ── Sección de firma ─────────────────────────────────── */
		.firma-section {
			background:    var(--surface-02);
			border:        1px solid var(--border-subtle);
			border-radius: 10px;
			overflow:      hidden;
		}

		.firma-section__header {
			padding:         12px 16px;
			border-bottom:   1px solid var(--border-subtle);
			display:         flex;
			align-items:     center;
			justify-content: space-between;
		}

		.firma-section__title {
			font-family:  var(--font-condensed);
			font-size:    var(--text-xl);
			font-weight:  700;
			color:        var(--text-primary);
			line-height:  1;
		}

		/* Bloqueo informativo */
		.firma-bloqueada {
			padding:       16px;
			text-align:    center;
			display:       flex;
			flex-direction: column;
			align-items:   center;
			gap:           8px;
			color:         var(--text-secondary);
			font-size:     var(--text-sm);
			line-height:   1.5;
		}
		.firma-bloqueada__icon { font-size: 28px; }

		.prereq-list {
			display:        flex;
			flex-direction: column;
			gap:            6px;
			width:          100%;
			text-align:     left;
		}

		.prereq-item {
			display:     flex;
			align-items: center;
			gap:         8px;
			padding:     8px 10px;
			border-radius: 6px;
			font-size:   var(--text-sm);
			font-weight: 600;
		}
		.prereq-item--ok      { background: var(--color-success-bg); color: var(--color-success);  }
		.prereq-item--pending { background: var(--surface-03);       color: var(--text-secondary); }
		.prereq-item--error   { background: var(--color-danger-bg);  color: var(--color-danger);   }

		/* PIN keypad */
		.pin-wrap {
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.pin-label {
			font-size:   var(--text-sm);
			color:       var(--text-secondary);
			text-align:  center;
			font-weight: 600;
		}

		.pin-input-wrap {
			position:   relative;
			max-width:  200px;
			margin:     0 auto;
			width:      100%;
		}

		.pin-input {
			width:            100%;
			box-sizing:       border-box;
			background:       var(--surface-03);
			border:           2px solid var(--border-subtle);
			border-radius:    10px;
			padding:          14px;
			font-family:      var(--font-mono);
			font-size:        24px;
			font-weight:      700;
			color:            var(--text-primary);
			text-align:       center;
			letter-spacing:   0.3em;
			outline:          none;
			transition:       border-color 0.15s ease;
			-webkit-appearance: none;
		}
		.pin-input:focus        { border-color: var(--accent); }
		.pin-input[aria-invalid="true"] { border-color: var(--color-danger); }

		.pin-error {
			font-size:   var(--text-sm);
			color:       var(--color-danger);
			font-weight: 600;
			text-align:  center;
			min-height:  18px;
		}

		.btn-firmar {
			width:           100%;
			display:         flex;
			align-items:     center;
			justify-content: center;
			gap:             8px;
			padding:         14px;
			border-radius:   10px;
			background:      var(--color-success);
			border:          none;
			color:           #fff;
			font-family:     var(--font-sans);
			font-size:       var(--text-base);
			font-weight:     700;
			cursor:          pointer;
			transition:      all 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-firmar:hover    { filter: brightness(1.1); }
		.btn-firmar:active   { transform: scale(0.99); }
		.btn-firmar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

		.btn-spinner {
			width:         16px;
			height:        16px;
			border:        2px solid rgba(255,255,255,0.3);
			border-top-color: #fff;
			border-radius: 50%;
			animation:     spin 0.7s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }

		/* Firma completada */
		.firma-ok {
			padding:        20px 16px;
			text-align:     center;
			display:        flex;
			flex-direction: column;
			align-items:    center;
			gap:            8px;
			color:          var(--color-success);
		}
		.firma-ok__icon  { font-size: 36px; }
		.firma-ok__title { font-family: var(--font-condensed); font-size: var(--text-2xl); font-weight: 800; }
		.firma-ok__meta  { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-tertiary); }
		.firma-ok__bloqueo {
			font-size:   var(--text-sm);
			color:       var(--text-secondary);
			line-height: 1.5;
			max-width:   280px;
		}

		/* Continuación post-firma: acciones para pasar a Permiso de Trabajo */
		.firma-ok__actions {
			display:        flex;
			flex-direction: column;
			gap:            8px;
			width:          100%;
			margin-top:     8px;
		}

		.btn-crear-permiso {
			width:           100%;
			display:         flex;
			align-items:     center;
			justify-content: center;
			gap:             8px;
			padding:         14px;
			border-radius:   10px;
			background:      var(--accent);
			border:          none;
			color:           #000;
			font-family:     var(--font-sans);
			font-size:       var(--text-base);
			font-weight:     700;
			cursor:          pointer;
			transition:      all 0.15s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.btn-crear-permiso:hover  { background: var(--accent-hover); }
		.btn-crear-permiso:active { transform: scale(0.99); }

		.btn-volver-ats {
			width:           100%;
			padding:         12px;
			border-radius:   10px;
			background:      transparent;
			border:          1px solid var(--border-subtle);
			color:           var(--text-secondary);
			font-family:     var(--font-sans);
			font-size:       var(--text-sm);
			font-weight:     600;
			cursor:          pointer;
			-webkit-tap-highlight-color: transparent;
			transition:      all 0.15s ease;
		}
		.btn-volver-ats:hover { border-color: var(--accent); color: var(--accent); }

		/* Aviso de ATS ya firmado si el usuario llega a intentar reenviar el form */
		.firma-ya-firmado-aviso {
			padding:       10px 12px;
			border-radius: 8px;
			background:    var(--color-info-bg);
			color:         var(--color-info);
			font-size:     var(--text-sm);
			font-weight:   600;
			text-align:    center;
		}

		/* ── Skeletons ────────────────────────────────────────── */
		.skeleton-card {
			height: 100px; border-radius: 10px;
			background: var(--surface-02);
			animation: shimmer 1.5s ease-in-out infinite;
		}
		@keyframes shimmer {
			0%, 100% { opacity: 0.8; }
			50%       { opacity: 0.4; }
		}

		/* ── Empty / error ────────────────────────────────────── */
		.empty-note { font-size: var(--text-sm); color: var(--text-tertiary); padding: 12px 16px; font-style: italic; }

		.page-error {
			flex: 1; display: flex; flex-direction: column; align-items: center;
			justify-content: center; padding: 32px 24px; text-align: center; gap: 8px;
		}
		/* Sin esto, [hidden] pierde contra el display:flex de arriba y el
		   cartel de error queda visible siempre, aunque no haya error. */
		.page-error[hidden] { display: none; }
		.page-error__icon  { font-size: 40px; }
		.page-error__title { font-family: var(--font-condensed); font-size: var(--text-xl); font-weight: 700; color: var(--text-secondary); }
		.page-error__sub   { font-size: var(--text-sm); color: var(--text-tertiary); }
		.page-error__detail {
			margin-top: 12px; padding: 10px 12px; border-radius: 8px;
			background: var(--surface-02); border: 1px solid var(--border-subtle);
			font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
			text-align: left; max-width: 100%; word-break: break-word; white-space: pre-wrap;
		}
		.page-error__retry {
			margin-top: 14px; padding: 10px 20px; border-radius: 8px;
			background: var(--accent); border: none; color: #000;
			font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 700;
			cursor: pointer; -webkit-tap-highlight-color: transparent;
		}
	</style>
</head>
<body>
<div class="app">

	<!-- ── Header ──────────────────────────────────────────── -->
	<header class="app-header" role="banner">
		<div class="app-header__left">
			<button id="btn-back" class="btn-back" type="button" aria-label="Volver">
				<svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
					<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/>
				</svg>
			</button>
			<h1 id="header-title" class="app-header__title">Revisar ATS</h1>
		</div>
		<span id="header-chip"></span>
	</header>

	<!-- ── Main ────────────────────────────────────────────── -->
	<main class="detail-main" id="main-content" role="main">

		<!-- Skeletons -->
		<div id="skeleton-area">
			<div class="skeleton-card"></div>
			<div class="skeleton-card"></div>
			<div class="skeleton-card"></div>
		</div>

		<!-- Contenido -->
		<div id="content-area" hidden>

			<!-- Datos del ATS -->
			<div class="card">
				<div class="card__header">
					<span class="card__title">Datos del ATS</span>
				</div>
				<div class="data-rows">

<!-- ── Módulo ─────────────────────────────────────────── -->
<script type="module">
	/**
	 * ats-supervisor.html — revisión, charla pre-trabajo y firma PIN.
	 *
	 * Funciones RPC verificadas MCP 2026-06-24:
	 *   fn_verificar_pin(p_usuario_id uuid, p_pin text) → boolean
	 *   fn_crear_nonce(p_usuario_id uuid) → uuid (anti-replay)
	 *
	 * Errores del trigger fn_bloqueo_ats_instancias (BEFORE UPDATE en
	 * ats_instancias, ERRCODE P0001):
	 *   ERR_HSE_04: induccion_completada = false
	 *   ERR_HSE_05: no charla pre-trabajo para esta instancia
	 *   ERR_HSE_06: firmante no figura como asistente
	 *   ATS_LOCK:   ATS ya bloqueado/firmado
	 *
	 * ── ATOMICIDAD ats_instancias ↔ ats_firmas (verificado 2026-09-20
	 * vía pg_get_functiondef en vivo — NO existe una RPC ni mecanismo
	 * transaccional que una ambos pasos; son dos triggers en tablas
	 * separadas, cada INSERT/UPDATE de supabase-js es su propia
	 * transacción autocommit) ────────────────────────────────────
	 * ats_firmas tiene DOS triggers BEFORE INSERT propios:
	 *   fn_bloqueo_ats_firmas: EXIGE que ats_instancias.bloqueado=true
	 *     y estado='Firmado' ANTES de aceptar la fila (ERR_HSE_17 si
	 *     no) — por eso el orden UPDATE→INSERT de handleFirmar() no es
	 *     una preferencia de estilo, es el ÚNICO orden que el backend
	 *     permite. También rechaza una segunda firma para la misma
	 *     instancia con ATS_LOCK, y repite induccion/asistente
	 *     (ERR_HSE_04/06).
	 *   validar_y_forzar_firma_ats: si el puesto de trabajo del ATS
	 *     requiere_certificacion y el operario tiene un vencimiento
	 *     'Vencido' en mantenimientos_y_vencimientos, rechaza con
	 *     ERR_HSE_02 — y esto puede pasar CON ats_instancias YA EN
	 *     'Firmado', porque fn_bloqueo_ats_instancias no chequea
	 *     vencimientos normativos al permitir la transición de estado.
	 *     Ahí está el hueco real de inconsistencia: un ATS puede quedar
	 *     Firmado+bloqueado para un operario que después no pasa este
	 *     segundo chequeo. Arreglo mínimo de backend propuesto (no
	 *     aplicado desde este archivo): mover/duplicar el chequeo de
	 *     mantenimientos_y_vencimientos a fn_bloqueo_ats_instancias,
	 *     para que bloquee en el MISMO gate que induccion/charla/
	 *     asistente, antes de que el ATS llegue a Firmado.
	 *     Mientras tanto: handleFirmar() distingue este código
	 *     (ERR_HSE_02/03/17) del resto y avisa con un mensaje
	 *     específico — no lo oculta, pero tampoco puede resolverlo
	 *     desde el frontend.
	 *
	 * ats_capacitacion_asistentes: sin deleted_at (no soft-delete)
	 *   eficacia: 'Bueno'|'Regular'|'Malo' (nullable)
	 *
	 * Flujo de firma:
	 *   1. fn_crear_nonce(usuario.id) → nonce UUID (anti-replay)
	 *   2. fn_verificar_pin(usuario.id, pin) → boolean
	 *   3. Si true: UPDATE ats_instancias SET estado='Firmado', version=v+1
	 *      Trigger sets: bloqueado=true, firmado_en=now(), fecha_hora_firma=now()
	 *   4. INSERT ats_firmas
	 *
	 * ── DIAGNÓSTICO Y OFFLINE-FIRST (2026-09-10) ──────────────────
	 * FIX: esta pantalla nunca tenía camino offline (mismo patrón que
	 * ya se corrigió en incidente-detalle.html, accion-detalle.html y
	 * permiso-detalle.html) — sólo consultaba Supabase directo. Un
	 * fallo de sesión, red o RLS caía siempre en el mismo mensaje
	 * genérico "No se pudo cargar", sin mostrar la causa real.
	 * Ahora:
	 *   1. Intenta SQLite local primero (queryLocal) para los datos
	 *      básicos del ATS.
	 *   2. Si falla el camino online, muestra el mensaje de error REAL
	 *      de Supabase/PostgREST (código + texto), no un genérico —
	 *      incluye también el estado de la sesión (auth.uid() y
	 *      empresa_id resuelta) para poder diagnosticar RLS/sesión
	 *      sin necesitar la consola del navegador.
	 *   3. Agrega un botón "Reintentar" en la pantalla de error.
	 *
	 * ── CONTINUACIÓN POST-FIRMA (2026-09-17) ──────────────────────
	 * FIX: al firmar, la pantalla llegaba a "ATS Firmado" y quedaba sin
	 * salida — no había forma de continuar al Permiso de Trabajo desde
	 * acá. Ahora:
	 *   1. El branch 'Firmado' de renderFirma() agrega "Crear Permiso
	 *      de Trabajo" (navega a /permiso-nuevo.html?ats_id=<id real,
	 *      nunca hardcodeado>) y "Volver a ATS".
	 *   2. handleFirmar() usa crearNonce() y verificarPin() (ya
	 *      importadas) en vez de descartar el nonce y llamar
	 *      fn_verificar_pin por rpc() directo.
	 *   3. Tras firmar, se actualiza _instancia en memoria con la fila
	 *      que devuelve el propio UPDATE y se vuelve a renderizar (sin
	 *      window.location.reload()) — evita el reload completo y una
	 *      posible carrera con PowerSync si el mirror local todavía no
	 *      bajó el cambio recién escrito online.
	 *   4. init() atrapa el error de requireAuth() (no toma argumento
	 *      ni redirige sola) y redirige a /login.html — antes, sin
	 *      sesión, el error quedaba sin atrapar y la pantalla se
	 *      colgaba en el skeleton.
	 *
	 * ── ROBUSTEZ (2026-09-18) ──────────────────────────────────────
	 * - cargarAtsPrincipal(): la lectura local de PowerSync ahora está
	 *   en try/catch — un error real (no sólo "no listo") ya no se
	 *   confundía con un error de Supabase en el diagnóstico de cargarDatos().
	 * - getUsuario() nulo ya no deja la pantalla a medio autenticar:
	 *   cargarUsuarioYDatos() corta con error claro y reintentable
	 *   (invalidarCacheUsuario() antes de reintentar).
	 * - _usuarios (roster completo de la empresa) se dejó de traer en
	 *   cada carga de página — ahora es lazy, en abrirFormCharla().
	 * - El insert en ats_capacitacion_asistentes ahora se chequea: antes
	 *   una charla podía quedar creada sin ningún asistente, sin aviso,
	 *   bloqueando la firma de todos sin explicación.
	 * - handleSupabaseError() (ya exportada, sin usar en este archivo)
	 *   reemplaza el manejo de errores ad-hoc en guardar charla e
	 *   insertar ats_firmas.
	 * - ats_firmas: un reintento simple ante fallo; si igual falla, aviso
	 *   VISIBLE (toast) en vez de sólo console.warn — no bloquea el
	 *   flujo, el ATS ya quedó Firmado y bloqueado en el paso 3.
	 * - Conflicto de versión al firmar: en vez de pedir recargar la
	 *   página a mano, se trae el estado real y se re-renderiza en el
	 *   momento (aviso por toast, no por pinErrorEl, que renderFirma()
	 *   puede reemplazar).
	 */

	import {
		supabase,
		requireAuth,
		getUsuario,
		getEmpresaId,
		crearNonce,
		verificarPin,
		handleSupabaseError,
		invalidarCacheUsuario,
	} from '/src/js/atshel-supabase.js';

	import {
		isPowerSyncReady,
		queryLocal,
		parseJsonField,
	} from '/src/js/atshel-powersync.js';

	import {
		sanitizeHTML,
		generateLocalId,
		formatFecha,
		formatFechaCorta,
		showToast,
	} from '/src/js/atshel-core.js';

	// ── ID desde URL ─────────────────────────────────────────
	const _instanciaId = new URLSearchParams(window.location.search).get('id');

	// ── Estado ───────────────────────────────────────────────
	let _instancia    = null;
	let _plantilla    = null;
	let _respuestas   = [];
	let _campos       = [];
	let _charlas      = [];
	let _charlasError = null; // mensaje si la última consulta de charlas falló (null = OK)
	let _firmantes    = [];  // ats_firmas
	let _usuario      = null;
	let _usuarios     = [];  // todos los usuarios de la empresa
	let _submitting   = false;
	let _pinIntentos  = 0;

	// ── Referencias DOM ──────────────────────────────────────
	const btnBackEl          = document.getElementById('btn-back');
	const headerTitleEl      = document.getElementById('header-title');
	const headerChipEl       = document.getElementById('header-chip');
	const skeletonAreaEl     = document.getElementById('skeleton-area');
	const contentAreaEl      = document.getElementById('content-area');
	const pageErrorEl        = document.getElementById('page-error');
	const pageErrorSubEl     = document.getElementById('page-error-sub');
	const pageErrorDetailEl  = document.getElementById('page-error-detail');
	const btnRetryEl         = document.getElementById('btn-retry');
	const camposRespondidosEl= document.getElementById('campos-respondidos');
	const ipercListaEl       = document.getElementById('iperc-lista');
	const ipercCountEl       = document.getElementById('iperc-count');
	const charlasListaEl     = document.getElementById('charla-lista');
	const charlasCountEl     = document.getElementById('charla-count');
	const charlaFormWrapEl   = document.getElementById('charla-form-wrap');
	const btnAddCharlaWrap   = document.getElementById('btn-add-charla-wrap');
	const asistentesWrapEl   = document.getElementById('asistente-checkboxes');
	const charlaDurEl        = document.getElementById('charla-duracion');
	const charlaTemasEl      = document.getElementById('charla-temas');
	const charlaTipoEl       = document.getElementById('charla-tipo');
	const charlaErrorEl      = document.getElementById('charla-error');
	const btnAddCharlaEl     = document.getElementById('btn-add-charla');
	const btnCancelarCharlaEl= document.getElementById('btn-cancelar-charla');
	const btnGuardarCharlaEl = document.getElementById('btn-guardar-charla');
	const firmaBodyEl        = document.getElementById('firma-body');
	const firmaEstadoChipEl  = document.getElementById('firma-estado-chip');

	// ── Chips de estado ───────────────────────────────────────
	const ESTADO_CHIP = {
		'Borrador':   ['neutral', 'Borrador'],
		'En_curso':   ['warning', 'En curso'],
		'Completado': ['info',    'Completado'],
		'Firmado':    ['success', 'Firmado'],
		'Cancelado':  ['neutral', 'Cancelado'],
	};

	// ── Render: header chip ────────────────────────────────────
	function renderHeader(instancia, plantilla) {
		const nombre = plantilla?.nombre_ats || 'ATS';
		headerTitleEl.textContent = nombre;
		const [cls, label] = ESTADO_CHIP[instancia.estado] || ['neutral', instancia.estado];
		headerChipEl.innerHTML = `<span class="chip chip--${cls}">${sanitizeHTML(label)}</span>`;
	}

	// ── Render: datos del ATS ─────────────────────────────────
	function renderDatos(instancia, plantilla, creadorNombre) {
		document.getElementById('val-plantilla').textContent = plantilla?.nombre_ats || '—';
		document.getElementById('val-tipo').textContent      = plantilla?.tipo_trabajo || '—';
		document.getElementById('val-creador').textContent   = creadorNombre || '—';
		document.getElementById('val-fecha').textContent     = instancia.created_at
			? formatFechaCorta(instancia.created_at) : '—';
	}

	// ── Render: campos respondidos (read-only) ────────────────
	function renderCampos(campos, respuestas) {
		if (!campos.length && !respuestas.length) {
			camposRespondidosEl.innerHTML = `<p class="empty-note">Sin campos en esta plantilla.</p>`;
			return;
		}

		const respMap = {};
		respuestas.forEach(r => { respMap[r.campo_id] = r.valor; });

		const items = campos.map(c => {
			const valor = respMap[c.id] ?? '—';
			const display = c.tipo_campo === 'booleano'
				? (valor === 'true' ? 'Sí ✓' : 'No')
				: sanitizeHTML(valor);
			return `
			<div class="data-row">
				<span class="data-row__label">${sanitizeHTML(c.etiqueta)}</span>
				<span class="data-row__value">${display}</span>
			</div>`;
		}).join('');

		camposRespondidosEl.innerHTML = items || `<p class="empty-note">Sin respuestas registradas.</p>`;
	}

	// ── Render: IPERC ─────────────────────────────────────────
	function renderIperc(riesgos) {
		const arr = Array.isArray(riesgos) ? riesgos : [];
		ipercCountEl.textContent = arr.length;
		ipercCountEl.className   = arr.length > 0 ? 'chip chip--warning' : 'chip chip--neutral';

		if (!arr.length) {
			ipercListaEl.innerHTML = `<p class="empty-note">Sin ítems de IPERC registrados.</p>`;
			return;
		}

		ipercListaEl.innerHTML = arr.map((item, i) => `
		<div class="iperc-ro">
			<div class="iperc-ro__num">Riesgo #${i + 1}</div>
			<div class="iperc-ro__grid">
				<div class="iperc-ro__field">
					<div class="iperc-ro__label">Tarea</div>
					<div class="iperc-ro__val">${sanitizeHTML(item.tarea || '—')}</div>
				</div>
				<div class="iperc-ro__field">
					<div class="iperc-ro__label">Peligro</div>
					<div class="iperc-ro__val">${sanitizeHTML(item.peligro || '—')}</div>
				</div>
				<div class="iperc-ro__half">
					<div class="iperc-ro__label">Riesgo inherente</div>
					<div class="iperc-ro__val">${sanitizeHTML(item.riesgo_inherente || '—')}</div>
				</div>
				<div class="iperc-ro__half">
					<div class="iperc-ro__label">Riesgo residual</div>
					<div class="iperc-ro__val">${sanitizeHTML(item.riesgo_residual || '—')}</div>
				</div>
				<div class="iperc-ro__field">
					<div class="iperc-ro__label">Controles</div>
					<div class="iperc-ro__val">${sanitizeHTML(item.controles || '—')}</div>
				</div>
			</div>
		</div>`).join('');
	}

	// ── Render: charlas ───────────────────────────────────────
	function renderCharlas(charlas) {
		// No confundir "todavía no hay charlas" con "no se pudo consultar":
		// antes, un error de red/consulta dejaba _charlas en [] y esto se
		// veía idéntico a "sin charlas registradas".
		if (_charlasError) {
			charlasCountEl.textContent = '⚠';
			charlasCountEl.className   = 'chip chip--danger';
			charlasListaEl.innerHTML   = `<p class="empty-note" style="color:var(--color-danger)">No se pudo consultar las charlas: ${sanitizeHTML(_charlasError)}</p>`;
			return;
		}

		charlasCountEl.textContent = charlas.length;
		charlasCountEl.className   = charlas.length > 0 ? 'chip chip--success' : 'chip chip--neutral';

		if (!charlas.length) {
			charlasListaEl.innerHTML = `<p class="empty-note">Sin charlas registradas. Registrá una antes de firmar.</p>`;
			return;
		}

		charlasListaEl.innerHTML = charlas.map(ch => {
			const tipoLabel = { Charla_pre_trabajo: 'Charla pre-trabajo', Induccion: 'Inducción', Capacitacion: 'Capacitación' };
			const asistentes = (ch.ats_capacitacion_asistentes ?? [])
				.map(a => a.nombre_completo || a.trabajador_id?.substring(0, 8) || '—')
				.filter(Boolean);

			return `
			<div class="charla-item">
				<div class="charla-item__header">
					<span class="charla-item__tipo">${sanitizeHTML(tipoLabel[ch.tipo] || ch.tipo)}</span>
					<span class="charla-item__meta">${sanitizeHTML(formatFechaCorta(ch.fecha_hora))}</span>
				</div>
				${ch.temas ? `<div style="font-size:var(--text-xs);color:var(--text-secondary)">${sanitizeHTML(ch.temas)}</div>` : ''}
				${ch.duracion_minutos ? `<div style="font-size:var(--text-xs);color:var(--text-tertiary);margin-top:2px">${ch.duracion_minutos} min</div>` : ''}
				${asistentes.length > 0 ? `
				<div class="asistente-list">
					${asistentes.map(n => `<span class="asistente-pill">${sanitizeHTML(n)}</span>`).join('')}
				</div>` : ''}
			</div>`;
		}).join('');
	}

	// ── Render: sección de firma ──────────────────────────────
	function renderFirma(instancia, charlas) {
		// Si ya está firmado (y por lo tanto bloqueado — el trigger del
		// backend garantiza que estado='Firmado' implica bloqueado=true)
		if (instancia.estado === 'Firmado') {
			firmaEstadoChipEl.innerHTML = '<span class="chip chip--success">Firmado</span>';
			firmaBodyEl.innerHTML = `
			<div class="firma-ok">
				<div class="firma-ok__icon">✅</div>
				<div class="firma-ok__title">ATS FIRMADO</div>
				<div class="firma-ok__meta">${sanitizeHTML(instancia.firmado_en ? formatFecha(instancia.firmado_en) : '—')}</div>
				<p class="firma-ok__bloqueo">El ATS fue firmado correctamente. El documento quedó bloqueado y no admite modificaciones. El siguiente paso es generar el Permiso de Trabajo.</p>
				<div class="firma-ok__actions">
					<button id="btn-crear-permiso" class="btn-crear-permiso" type="button">
						Crear Permiso de Trabajo
					</button>
					<button id="btn-volver-ats-firmado" class="btn-volver-ats" type="button">
						Volver a ATS
					</button>
				</div>
			</div>`;

			// Listeners para el DOM recién creado (mismo patrón que el input de PIN)
			document.getElementById('btn-crear-permiso').addEventListener('click', () => {
				// El ID se toma dinámicamente del ATS cargado — nunca hardcodeado.
				const url = `/permiso-nuevo.html?ats_id=${encodeURIComponent(instancia.id)}`;
				window.location.assign(url);
			});
			document.getElementById('btn-volver-ats-firmado').addEventListener('click', () => {
				window.location.assign('/ats-nuevo.html');
			});
			return;
		}

		// Si está cancelado
		if (instancia.estado === 'Cancelado') {
			firmaBodyEl.innerHTML = `<p class="empty-note" style="text-align:center;padding:20px">ATS cancelado — no se puede firmar ni modificar.</p>`;
			return;
		}

		// Si la última consulta de charlas falló, no calcular prerequisitos
		// con datos que sabemos que están incompletos — eso mostraría
		// "○ Pendiente" para algo que en realidad no se pudo verificar,
		// indistinguible de "todavía no registraste la charla".
		if (_charlasError) {
			firmaEstadoChipEl.innerHTML = '<span class="chip chip--danger">Error</span>';
			firmaBodyEl.innerHTML = `
			<div class="firma-bloqueada">
				<div class="firma-bloqueada__icon" aria-hidden="true">⚡</div>
				<p style="color:var(--color-danger);font-weight:600;text-align:center">No se pudo verificar si podés firmar: ${sanitizeHTML(_charlasError)}</p>
				<button id="btn-reintentar-charlas" class="btn-volver-ats" type="button">Reintentar</button>
			</div>`;
			document.getElementById('btn-reintentar-charlas').addEventListener('click', recargarCharlas);
			return;
		}

		// Verificar pre-requisitos para firma
		const tieneCharla    = charlas.length > 0;
		const esAsistente    = charlas.some(ch =>
			(ch.ats_capacitacion_asistentes ?? []).some(a => a.trabajador_id === _usuario?.id)
		);
		const tieneInduccion = _usuario?.induccion_completada === true;
		const puedeFirmar    = tieneCharla && esAsistente && tieneInduccion;

		// Mostrar estado de pre-requisitos
		const prereqs = `
		<div class="firma-bloqueada">
			<div class="firma-bloqueada__icon" aria-hidden="true">🔏</div>
			<div class="prereq-list">
				<div class="prereq-item prereq-item--${tieneInduccion ? 'ok' : 'error'}">
					<span>${tieneInduccion ? '✓' : '✕'}</span>
					Inducción general completada
				</div>
				<div class="prereq-item prereq-item--${tieneCharla ? 'ok' : 'pending'}">
					<span>${tieneCharla ? '✓' : '○'}</span>
					Charla pre-trabajo registrada
				</div>
				<div class="prereq-item prereq-item--${esAsistente ? 'ok' : 'pending'}">
					<span>${esAsistente ? '✓' : '○'}</span>
					Firmante figura como asistente
				</div>
			</div>
		</div>`;

		if (!puedeFirmar) {
			firmaBodyEl.innerHTML = prereqs;
			firmaEstadoChipEl.innerHTML = '<span class="chip chip--warning">Pendiente</span>';
			return;
		}

		firmaEstadoChipEl.innerHTML = '<span class="chip chip--info">Listo para firmar</span>';

		// Mostrar prereqs + input PIN
		firmaBodyEl.innerHTML = `
		${prereqs}
		<div class="pin-wrap">
			<div class="pin-label">Ingresá tu PIN para firmar</div>
			<div class="pin-input-wrap">
				<input
					id="pin-input"
					class="pin-input"
					type="password"
					inputmode="numeric"
					pattern="[0-9]*"
					maxlength="6"
					placeholder="••••••"
					autocomplete="current-password"
					aria-label="PIN de firma"
					aria-required="true"
				>
			</div>
			<div id="pin-error" class="pin-error" aria-live="polite"></div>
			<button id="btn-firmar" class="btn-firmar" type="button" aria-label="Firmar ATS con PIN">
				<span id="btn-firmar-text">✍️ Firmar ATS</span>
				<span id="btn-firmar-spinner" class="btn-spinner" hidden aria-hidden="true"></span>
			</button>
		</div>`;

		// Agregar listener del PIN inmediatamente (no en init, porque este DOM se crea ahora)
		const pinInputEl  = document.getElementById('pin-input');
		const pinErrorEl  = document.getElementById('pin-error');
		const btnFirmarEl = document.getElementById('btn-firmar');

		pinInputEl.addEventListener('input', () => {
			pinErrorEl.textContent = '';
			pinInputEl.removeAttribute('aria-invalid');
		});

		btnFirmarEl.addEventListener('click', () => handleFirmar(pinInputEl, pinErrorEl, btnFirmarEl));

		pinInputEl.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') handleFirmar(pinInputEl, pinErrorEl, btnFirmarEl);
		});

		// Focus automático al PIN
		setTimeout(() => pinInputEl.focus(), 100);
	}

	// ── Guardar charla pre-trabajo ────────────────────────────
	async function handleGuardarCharla() {
		charlaErrorEl.textContent = '';
		btnGuardarCharlaEl.disabled = true;

		try {
			const duracion = parseInt(charlaDurEl.value, 10);
			if (!duracion || duracion < 1) {
				charlaErrorEl.textContent = 'La duración debe ser mayor a 0 minutos.';
				return;
			}

			// Recoger asistentes seleccionados
			const seleccionados = Array.from(
				asistentesWrapEl.querySelectorAll('input[type="checkbox"]:checked')
			).map(cb => cb.value);

			if (seleccionados.length === 0) {
				charlaErrorEl.textContent = 'Seleccioná al menos un asistente.';
				return;
			}

			const empresaId = _usuario?.empresa_id ?? await getEmpresaId();

			const { data: charla, error: charlaErr } = await supabase
				.from('ats_capacitaciones_pre_trabajo')
				.insert({
					ats_instancia_id:  _instanciaId,
					empresa_id:        empresaId,
					dictada_por:       _usuario?.id,
					tipo:              charlaTipoEl.value,    // 'Charla_pre_trabajo'|'Induccion'|'Capacitacion'
					temas:             charlaTemasEl.value.trim() || null,
					duracion_minutos:  duracion,
					fecha_hora:        new Date().toISOString(),
				})
				.select('id')
				.single();

			if (charlaErr) {
				charlaErrorEl.textContent = handleSupabaseError(charlaErr, 'Guardar charla pre-trabajo');
				return;
			}

			// Insertar asistentes (sin soft-delete en esta tabla)
			const asistentesPayload = seleccionados.map(trabajadorId => ({
				capacitacion_id: charla.id,
				trabajador_id:   trabajadorId,
				empresa_id:      empresaId,
				confirmado:      trabajadorId === _usuario?.id,
				confirmado_en:   trabajadorId === _usuario?.id ? new Date().toISOString() : null,
			}));

			const { error: asistentesErr } = await supabase
				.from('ats_capacitacion_asistentes')
				.insert(asistentesPayload);

			if (asistentesErr) {
				// La charla ya quedó creada (tiene id), pero sin asistentes
				// no cuenta para "esAsistente" — antes este resultado no se
				// chequeaba: podía quedar una charla "registrada" que en la
				// práctica no habilitaba la firma de nadie, sin ninguna
				// pista de por qué. No hay forma de reintentar sólo los
				// asistentes de esta charla puntual desde esta pantalla, así
				// que se avisa con claridad en vez de fingir que se guardó bien.
				showToast(
					`La charla se guardó, pero no se pudieron registrar los asistentes: ${handleSupabaseError(asistentesErr, 'Insertar asistentes')}`,
					'warning'
				);
				cerrarFormCharla();
				await recargarCharlas();
				return;
			}

			showToast('Charla registrada correctamente.', 'success');
			cerrarFormCharla();
			// Recargar charlas y actualizar firma
			await recargarCharlas();

		} catch (err) {
			charlaErrorEl.textContent = err.message || 'Error inesperado.';
		} finally {
			btnGuardarCharlaEl.disabled = false;
		}
	}

	async function recargarCharlas() {
		const { data, error } = await supabase
			.from('ats_capacitaciones_pre_trabajo')
			.select(`
				id, tipo, temas, duracion_minutos, fecha_hora,
				ats_capacitacion_asistentes(trabajador_id, confirmado, usuarios(nombre_completo))
			`)
			.eq('ats_instancia_id', _instanciaId)
			.order('fecha_hora', { ascending: false });

		if (error) {
			// Antes esto se descartaba (sólo se leía { data }): un error acá
			// dejaba _charlas en [] y se veía igual que "no hay charlas".
			console.error('[ATSHEL] Error al recargar charlas:', error.message);
			_charlasError = handleSupabaseError(error, 'Recargar charlas');
			renderCharlas(_charlas);
			renderFirma(_instancia, _charlas);
			return;
		}

		_charlasError = null;

		// Normalizar nombres de asistentes
		_charlas = (data ?? []).map(ch => ({
			...ch,
			ats_capacitacion_asistentes: (ch.ats_capacitacion_asistentes ?? []).map(a => ({
				...a,
				nombre_completo: a.usuarios?.nombre_completo ?? null,
			})),
		}));

		renderCharlas(_charlas);
		renderFirma(_instancia, _charlas);
	}

	async function abrirFormCharla() {
		charlaFormWrapEl.hidden  = false;
		btnAddCharlaWrap.hidden  = true;
		charlaDurEl.value        = '15';
		charlaTemasEl.value      = '';
		charlaErrorEl.textContent = '';

		// _usuarios se carga acá, una sola vez (se cachea en el módulo) —
		// antes se traía siempre en cargarDatos() aunque el supervisor
		// nunca llegara a abrir este formulario.
		if (_usuarios.length === 0) {
			asistentesWrapEl.innerHTML = `<p class="empty-note">Cargando usuarios de la empresa...</p>`;

			const { data, error } = await supabase
				.from('usuarios')
				.select('id, nombre_completo, rol, induccion_completada')
				.eq('activo', true)
				.is('deleted_at', null)
				.order('nombre_completo', { ascending: true });

			if (error) {
				// Antes, si esta consulta fallaba, los checkboxes quedaban
				// vacíos sin ninguna explicación.
				asistentesWrapEl.innerHTML = `<p class="empty-note">${sanitizeHTML(handleSupabaseError(error, 'Cargar usuarios'))}</p>`;
				return;
			}
			_usuarios = data ?? [];
		}

		// Popular checkboxes con usuarios
		asistentesWrapEl.innerHTML = _usuarios.map(u => `
		<label class="asistente-check">
			<input type="checkbox" value="${sanitizeHTML(u.id)}"
			       ${u.id === _usuario?.id ? 'checked' : ''}
			       aria-label="${sanitizeHTML(u.nombre_completo || u.id)}">
			<span class="asistente-check__name">${sanitizeHTML(u.nombre_completo || u.id)}</span>
		</label>`).join('');
	}

	function cerrarFormCharla() {
		charlaFormWrapEl.hidden = true;
		btnAddCharlaWrap.hidden = false;
	}

	// ── Firmar con PIN ────────────────────────────────────────
	async function handleFirmar(pinInputEl, pinErrorEl, btnFirmarEl) {
		if (_submitting) return;

		// Defensa adicional: este formulario no debería estar visible si el
		// ATS ya está Firmado (renderFirma no lo renderiza), pero si llega
		// a dispararse de todos modos, no reintentar la firma.
		if (_instancia.estado === 'Firmado') {
			showToast('Este ATS ya está firmado y bloqueado.', 'info');
			renderFirma(_instancia, _charlas);
			return;
		}

		const pin = pinInputEl.value.trim();
		if (!pin) {
			pinErrorEl.textContent = 'Ingresá tu PIN.';
			pinInputEl.setAttribute('aria-invalid', 'true');
			pinInputEl.focus();
			return;
		}
		if (!/^\d+$/.test(pin)) {
			pinErrorEl.textContent = 'El PIN debe contener solo números.';
			pinInputEl.setAttribute('aria-invalid', 'true');
			return;
		}

		_submitting               = true;
		btnFirmarEl.disabled      = true;
		document.getElementById('btn-firmar-text').hidden    = true;
		document.getElementById('btn-firmar-spinner').hidden = false;

		try {
			// 1. Crear nonce anti-replay — usando crearNonce() del módulo
			// (antes el resultado se descartaba sin chequear error)
			const nonceResult = await crearNonce(_usuario.id);
			if (!nonceResult.ok) {
				pinErrorEl.textContent = nonceResult.error || 'No se pudo generar el código de firma. Intentá de nuevo.';
				pinInputEl.setAttribute('aria-invalid', 'true');
				return;
			}

			// 2. Verificar PIN — usando verificarPin() del módulo (antes se
			// llamaba supabase.rpc('fn_verificar_pin', ...) directo pese a
			// que verificarPin() ya estaba importada sin usarse)
			const pinResult = await verificarPin(_usuario.id, pin);

			if (!pinResult.ok) {
				const esBloqueo = pinResult.error?.toUpperCase().includes('ERR_HSE_13');
				if (esBloqueo) {
					pinErrorEl.textContent = 'Cuenta bloqueada por múltiples intentos fallidos. Esperá 15 minutos.';
				} else {
					_pinIntentos++;
					const restantes = Math.max(0, 5 - _pinIntentos);
					pinErrorEl.textContent = restantes > 0
						? `PIN incorrecto. ${restantes} intento${restantes !== 1 ? 's' : ''} restante${restantes !== 1 ? 's' : ''}.`
						: 'PIN incorrecto. Cuenta bloqueada por 15 minutos.';
				}
				pinInputEl.setAttribute('aria-invalid', 'true');
				pinInputEl.value = '';
				pinInputEl.focus();
				return;
			}

			_pinIntentos = 0;

			// 3. UPDATE ats_instancias SET estado='Firmado'
			// Trigger fn_bloqueo_ats_instancias valida inducción + charla + asistente
			const { data: updated, error: updateErr } = await supabase
				.from('ats_instancias')
				.update({
					estado:  'Firmado',
					version: _instancia.version + 1,
				})
				.eq('id', _instanciaId)
				.eq('version', _instancia.version)
				.select('id, estado, firmado_en, version')
				.single();

			if (updateErr) {
				// Mapear errores del trigger
				const msg = updateErr.message || '';
				if (msg.includes('ERR_HSE_04')) {
					pinErrorEl.textContent = 'Tu inducción general no está completa. Completala antes de firmar.';
				} else if (msg.includes('ERR_HSE_05')) {
					pinErrorEl.textContent = 'Registrá una charla pre-trabajo antes de firmar.';
				} else if (msg.includes('ERR_HSE_06')) {
					pinErrorEl.textContent = 'Debés figurar como asistente en la charla pre-trabajo.';
				} else if (msg.includes('ATS_LOCK')) {
					pinErrorEl.textContent = 'Este ATS ya fue firmado.';
				} else {
					pinErrorEl.textContent = `Error al firmar: ${msg || 'Intentá de nuevo.'}`;
				}
				return;
			}

			if (!updated) {
				// Antes esto pedía "recargá la página a mano". Ahora se trae
				// el estado real (alguien más lo modificó mientras tanto) y
				// se re-renderiza en el momento. El aviso va por toast, no
				// por pinErrorEl: renderFirma() puede reemplazar ese nodo.
				const { data: actual, error: actualErr } = await supabase
					.from('ats_instancias')
					.select('id, estado, firmado_en, bloqueado, version')
					.eq('id', _instanciaId)
					.single();

				if (actualErr) console.error('[ATSHEL] No se pudo releer ats_instancias tras conflicto de versión:', actualErr.message);
				if (actual) _instancia = { ..._instancia, ...actual };

				showToast('Este ATS cambió mientras firmabas — probablemente otra persona lo modificó. Se actualizó la pantalla con el estado actual.', 'warning');
				renderHeader(_instancia, _plantilla);
				renderFirma(_instancia, _charlas);
				return;
			}

			// 4. INSERT ats_firmas (registro del evento de firma). Un
			// reintento simple ante fallo — no se usa _withRetry() de
			// atshel-supabase.js porque es privada del módulo, no exportada.
			//
			// Verificado en vivo (pg_get_functiondef) que ats_firmas tiene
			// DOS triggers BEFORE INSERT propios, además de lo que ya está
			// documentado arriba:
			//   fn_bloqueo_ats_firmas: exige que el ATS YA esté bloqueado=true
			//     y estado='Firmado' (ERR_HSE_17 si no), rechaza una segunda
			//     firma para la misma instancia (ATS_LOCK) y repite induc-
			//     ción/asistente (ERR_HSE_04/06).
			//   validar_y_forzar_firma_ats: si el puesto de trabajo del ATS
			//     requiere_certificacion y el operario tiene un vencimiento
			//     'Vencido' en mantenimientos_y_vencimientos, rechaza con
			//     ERR_HSE_02 — ESTO PUEDE PASAR CON ats_instancias YA EN
			//     'Firmado' (ver nota de atomicidad en la cabecera de este
			//     archivo). También ERR_HSE_03 si la instancia todavía no
			//     está visible en el servidor (orden de sync offline).
			const empresaId = _usuario?.empresa_id ?? await getEmpresaId();
			const insertarFirma = () => supabase.from('ats_firmas').insert({
				atshel_local_id:     generateLocalId(),
				instancia_id:        _instanciaId,
				usuario_id:          _usuario.id,
				empresa_id:          empresaId,
				fecha_firma_local:   new Date().toISOString(),
			});

			// ATS_LOCK acá significa "ya existe una firma para este ATS" —
			// no es un fallo: puede pasar si el primer intento sí llegó al
			// servidor pero la respuesta no volvió (ej. corte de red justo
			// después de escribir). Tratarlo como fallo y reintentar lo
			// único que lograría es un ATS_LOCK de nuevo, y mostrarle al
			// usuario "no se pudo registrar" cuando en realidad sí se
			// registró.
			const esFirmaYaRegistrada = (err) => err?.message?.includes('ATS_LOCK');

			let { error: firmaInsertErr } = await insertarFirma();
			if (firmaInsertErr && !esFirmaYaRegistrada(firmaInsertErr)) {
				({ error: firmaInsertErr } = await insertarFirma());
			}

			const firmaFalloDeVerdad = firmaInsertErr && !esFirmaYaRegistrada(firmaInsertErr);

			if (firmaFalloDeVerdad) {
				const msg = firmaInsertErr.message || '';
				let detalle;
				if (msg.includes('ERR_HSE_02')) {
					detalle = 'el operario tiene un vencimiento normativo pendiente (certificación vencida). El ATS quedó Firmado en el sistema, pero esta firma no cumple el requisito de aptitud — revisar antes de continuar al permiso.';
				} else if (msg.includes('ERR_HSE_03')) {
					detalle = 'la instancia todavía no está disponible en el servidor. Esperá a que sincronice e intentá de nuevo desde este mismo ATS.';
				} else if (msg.includes('ERR_HSE_17')) {
					detalle = 'inconsistencia de estado — el servidor todavía no ve el ATS como Firmado pese a que la actualización anterior fue exitosa.';
				} else {
					detalle = handleSupabaseError(firmaInsertErr, 'Insertar ats_firmas');
				}
				// No bloquea el flujo: el ATS ya quedó Firmado y bloqueado en
				// el paso 3 — eso es lo que importa operativamente. Esto es
				// el registro secundario del evento de firma, pero antes el
				// fallo sólo se veía en consola; ahora se avisa de forma
				// visible para que la inconsistencia quede trazada, no oculta.
				console.error('[ATSHEL] ats_firmas insert falló tras el UPDATE a Firmado:', firmaInsertErr.message);
				showToast(`ATS firmado y bloqueado correctamente. La evidencia de firma no se registró: ${detalle}`, 'warning');
			} else {
				showToast('¡ATS firmado correctamente!', 'success');
			}

			// Actualizar la pantalla con los datos reales que devolvió el
			// UPDATE (estado, firmado_en, version) en vez de recargar toda
			// la página: es más rápido, no pierde el scroll, y evita releer
			// SQLite local antes de que PowerSync haya bajado el cambio que
			// se acaba de escribir directo a Supabase.
			_instancia = { ..._instancia, ...updated };
			renderHeader(_instancia, _plantilla);
			renderFirma(_instancia, _charlas);
			return;

		} catch (err) {
			pinErrorEl.textContent = err.message || 'Error inesperado al firmar.';
		} finally {
			_submitting = false;
			if (btnFirmarEl) {
				btnFirmarEl.disabled = false;
				const t = document.getElementById('btn-firmar-text');
				const s = document.getElementById('btn-firmar-spinner');
				if (t) t.hidden = false;
				if (s) s.hidden = true;
			}
		}
	}

	// ── Carga offline-first del ATS principal ──────────────────
	async function cargarAtsPrincipal() {
		if (isPowerSyncReady()) {
			try {
				const filas = await queryLocal(
					'SELECT * FROM ats_instancias WHERE id = ? AND deleted_at IS NULL',
					[_instanciaId]
				);
				if (filas.length > 0) {
					const row = filas[0];
					return {
						...row,
						riesgos_evaluacion: parseJsonField(row.riesgos_evaluacion, []),
						_fuente: 'local',
					};
				}
			} catch (localErr) {
				// Una falla acá no debe tumbar la carga: se cae al camino
				// online. Antes, un error real de PowerSync (no sólo "no
				// listo todavía") se propagaba sin atrapar y el catch de
				// cargarDatos() lo trataba como si fuera un error de
				// Supabase/PostgREST, confundiendo el diagnóstico.
				console.warn('[ATSHEL] Lectura local (PowerSync) falló, se usa Supabase:', localErr?.message);
			}
		}

		const { data, error } = await supabase
			.from('ats_instancias')
			.select(`
				id, plantilla_id, empresa_id, creado_por, estado,
				riesgos_evaluacion, bloqueado, firmado_en, version, created_at,
				plantillas_ats!ats_instancias_plantilla_id_fkey(nombre_ats, tipo_trabajo),
				ats_respuestas!ats_respuestas_instancia_id_fkey(
					id, campo_id, valor, deleted_at
				)
			`)
			.eq('id', _instanciaId)
			.is('deleted_at', null)
			.single();

		if (error) throw error;
		return { ...data, _fuente: 'supabase' };
	}

	// ── Carga de datos ────────────────────────────────────────
	async function cargarDatos() {
		if (!_instanciaId) {
			showPageError('ID de ATS inválido.');
			return;
		}

		let instancia;
		try {
			instancia = await cargarAtsPrincipal();
		} catch (err) {
			// Diagnóstico: mostrar el error REAL de Supabase/PostgREST,
			// más el estado de sesión, en vez de un genérico mudo.
			let sesionInfo = '';
			try {
				const { data: sess } = await supabase.auth.getSession();
				const uid = sess?.session?.user?.id ?? '(sin sesión)';
				const empresaResuelta = await getEmpresaId().catch(() => '(no se pudo resolver)');
				sesionInfo = `auth.uid(): ${uid}\nempresa_id resuelta: ${empresaResuelta}`;
			} catch {
				sesionInfo = 'No se pudo leer el estado de sesión.';
			}

			const msg = err?.code === 'PGRST116'
				? 'ATS no encontrado o sin acceso (0 filas — probable problema de sesión/RLS, no de datos).'
				: handleSupabaseError(err, 'Cargar ATS');

			showPageError(msg, `${err?.code ?? 'sin código'} · ${err?.details ?? ''}\n${sesionInfo}`);
			return;
		}

		_instancia  = instancia;
		_plantilla  = instancia.plantillas_ats ?? null;
		_respuestas = (instancia.ats_respuestas ?? []).filter(r => !r.deleted_at);

		// Si vino del camino local, plantilla/respuestas no vienen embebidas —
		// se completan por separado más abajo (mismo bloque que ya existía).
		const { data: charlasData, error: charlasErr } = await supabase.from('ats_capacitaciones_pre_trabajo')
			.select(`
				id, tipo, temas, duracion_minutos, fecha_hora, dictada_por,
				ats_capacitacion_asistentes(
					trabajador_id, confirmado, eficacia,
					usuarios!ats_capacitacion_asistentes_trabajador_id_fkey(nombre_completo)
				)
			`)
			.eq('ats_instancia_id', _instanciaId)
			.order('fecha_hora', { ascending: false });

		// _usuarios (roster completo de la empresa) ya no se trae acá: sólo
		// lo necesita el form de "agregar charla", así que ahora se carga
		// bajo demanda en abrirFormCharla() la primera vez que se abre —
		// evita una consulta que la mayoría de las visitas a esta pantalla
		// (sólo revisar o firmar) nunca llega a usar.

		if (charlasErr) {
			// No confundir "sin charlas" con "no se pudo consultar": antes,
			// charlasResult.data ?? [] convertía cualquier error acá en una
			// lista vacía, indistinguible de "todavía no hay charla".
			console.error('[ATSHEL] Error al cargar charlas:', charlasErr.message);
			_charlasError = handleSupabaseError(charlasErr, 'Cargar charlas');
			_charlas = [];
		} else {
			_charlasError = null;
			// Normalizar charlas con nombres de asistentes
			_charlas = (charlasData ?? []).map(ch => ({
				...ch,
				ats_capacitacion_asistentes: (ch.ats_capacitacion_asistentes ?? []).map(a => ({
					...a,
					nombre_completo: a.usuarios?.nombre_completo ?? null,
				})),
			}));
		}

		// Si la plantilla no vino embebida (camino local), buscarla aparte
		if (!_plantilla && _instancia.plantilla_id) {
			const { data: pl, error: plErr } = await supabase
				.from('plantillas_ats')
				.select('nombre_ats, tipo_trabajo')
				.eq('id', _instancia.plantilla_id)
				.single();
			if (plErr) console.error('[ATSHEL] No se pudo cargar la plantilla:', plErr.message);
			_plantilla = pl ?? null;
		}

		// Si las respuestas no vinieron embebidas (camino local), buscarlas aparte
		if (_respuestas.length === 0 && _instancia._fuente === 'local') {
			const { data: resp, error: respErr } = await supabase
				.from('ats_respuestas')
				.select('id, campo_id, valor, deleted_at')
				.eq('instancia_id', _instanciaId)
				.is('deleted_at', null);
			if (respErr) console.error('[ATSHEL] No se pudieron cargar las respuestas:', respErr.message);
			_respuestas = resp ?? [];
		}

		// Cargar campos de la plantilla
		if (_instancia.plantilla_id) {
			const { data: campos, error: camposErr } = await supabase
				.from('campos_plantilla')
				.select('id, etiqueta, tipo_campo, orden')
				.eq('plantilla_id', _instancia.plantilla_id)
				.is('deleted_at', null)
				.order('orden', { ascending: true });
			if (camposErr) console.error('[ATSHEL] No se pudieron cargar los campos de la plantilla:', camposErr.message);
			_campos = campos ?? [];
		}

		// Cargar creador
		let creadorNombre = null;
		if (_instancia.creado_por) {
			const { data: creador, error: creadorErr } = await supabase
				.from('usuarios')
				.select('nombre_completo')
				.eq('id', _instancia.creado_por)
				.single();
			if (creadorErr) console.error('[ATSHEL] No se pudo cargar el nombre del creador:', creadorErr.message);
			creadorNombre = creador?.nombre_completo ?? null;
		}

		// Ocultar skeleton, mostrar contenido
		skeletonAreaEl.hidden = true;
		contentAreaEl.hidden  = false;

		// Renderizar todo
		renderHeader(_instancia, _plantilla);
		renderDatos(_instancia, _plantilla, creadorNombre);
		renderCampos(_campos, _respuestas);
		renderIperc(_instancia.riesgos_evaluacion ?? []);
		renderCharlas(_charlas);
		renderFirma(_instancia, _charlas);
	}

	// ── Error de página ───────────────────────────────────────
	function showPageError(msg, detalle) {
		skeletonAreaEl.hidden      = true;
		contentAreaEl.hidden      = true;
		pageErrorSubEl.textContent = msg;
		if (detalle) {
			pageErrorDetailEl.textContent = detalle;
			pageErrorDetailEl.hidden = false;
		} else {
			pageErrorDetailEl.hidden = true;
		}
		pageErrorEl.hidden         = false;
	}

	// ── Usuario + datos (reutilizable desde init() y Reintentar) ─
	async function cargarUsuarioYDatos() {
		// invalidarCacheUsuario() antes de leer: si esto se llama desde
		// "Reintentar" tras un fallo, evita que getUsuario() devuelva de
		// nuevo el mismo null cacheado en vez de reintentar de verdad.
		invalidarCacheUsuario();
		_usuario = await getUsuario().catch(() => null);

		if (!_usuario) {
			// Antes, si esto fallaba, el código seguía igual con _usuario en
			// null: la pantalla renderizaba a medias (sin nombre de usuario
			// para "esAsistente"/inducción) sin explicar por qué nunca se
			// podía firmar. Ahora se corta acá con un error claro.
			showPageError('No se pudo cargar tu perfil de usuario. Verificá tu conexión e intentá de nuevo.');
			return;
		}

		await cargarDatos();
	}

	// ── Init ─────────────────────────────────────────────────
	async function init() {
		// 1. Sesión — requireAuth() no recibe argumentos y no redirige por
		// sí sola: lanza ATSHELError si no hay sesión (ver atshel-supabase.js).
		// Esta pantalla no carga atshel-app.js (donde normalmente se
		// centraliza la redirección), así que hay que atraparlo acá.
		try {
			await requireAuth();
		} catch {
			window.location.assign('/login.html');
			return;
		}

		// 2. Usuario + datos del ATS
		await cargarUsuarioYDatos();

		// 3. Event listeners — los del PIN se registran en renderFirma al crear el DOM
		btnBackEl.addEventListener('click', () => {
			window.location.assign('/ats-nuevo.html');
		});

		btnAddCharlaEl.addEventListener('click', abrirFormCharla);
		btnCancelarCharlaEl.addEventListener('click', cerrarFormCharla);
		btnGuardarCharlaEl.addEventListener('click', handleGuardarCharla);

		charlaDurEl.addEventListener('input', () => {
			charlaErrorEl.textContent = '';
		});

		btnRetryEl.addEventListener('click', () => {
			pageErrorEl.hidden = true;
			skeletonAreaEl.hidden = false;
			cargarUsuarioYDatos();
		});
	}

	init();
</script>
</body>
</html>
